<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Coordinate Space</title>
<style>
  :root{
    --bg:#050506; --fg:#eceae6; --dim:#5c5c66; --line:#1d1d23;
    --hot:#38e08a; --warn:#ff4d2e;
    --order:#4da3ff; --inhab:#ffc84d; --press:#ff4d2e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:11px;letter-spacing:.06em;overflow:hidden}

  #head{position:fixed;top:0;left:0;right:318px;height:58px;z-index:40;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 18px}
  .brand{font-size:10px;letter-spacing:.19em;line-height:1.55}
  .brand i{font-style:normal;color:var(--dim);display:block;font-size:8px}
  #cmd{font:inherit;font-size:15px;letter-spacing:.19em;background:#0d0d11;color:var(--hot);
    border:1px solid var(--line);padding:5px 9px;width:86px;text-transform:uppercase;outline:none}
  #cmd:focus{border-color:var(--hot)}
  .lbl{font-size:8px;color:var(--dim);letter-spacing:.15em}
  .btn{border:1px solid var(--line);background:#0d0d11;color:var(--dim);padding:5px 9px;
    cursor:pointer;font:inherit;font-size:9px;letter-spacing:.12em}
  .btn:hover{color:var(--fg);border-color:var(--fg)}
  .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .sorts{display:flex;gap:1px;margin-left:auto}

  #field{position:fixed;top:58px;left:0;right:318px;bottom:52px;
    display:flex;align-items:center;justify-content:center}
  #board{position:relative}
  .c{position:absolute;border:1px solid var(--line);overflow:hidden;
     transition:transform .55s cubic-bezier(.22,.9,.24,1),left .55s,top .55s,border-color .2s}
  .c .th{position:absolute;inset:0;opacity:0;transition:opacity .45s}
  .c .th img{width:100%;height:100%;object-fit:cover;display:block}
  .c.seen .th,.c.showall .th{opacity:.9}
  .c .tint{position:absolute;inset:0;opacity:.30}
  .c.seen .tint,.c.showall .tint{opacity:0;transition:opacity .45s}
  .c.cur{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 20px rgba(56,224,138,.45);z-index:60}
  .c.cur .th{opacity:1}
  .c.target{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
  .ruler{position:absolute;color:var(--dim);font-size:8px;letter-spacing:.1em;pointer-events:none}
  .ruler.on{color:var(--hot)}

  #side{position:fixed;top:0;right:0;bottom:0;width:318px;z-index:30;
    border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column}
  #prev{width:100%;aspect-ratio:16/10;background:#0c0c10;border:1px solid var(--line);
    overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:9px;letter-spacing:.15em}
  #prev img{width:100%;height:100%;object-fit:cover;display:block}
  #meta{font-size:9px;line-height:1.78;color:var(--dim);flex:1;overflow:auto}
  #meta .t{color:var(--fg);font-size:10px;letter-spacing:.08em;display:block;margin-bottom:8px;line-height:1.5}
  #meta .row{display:flex;justify-content:space-between;gap:9px;
    border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
  #meta .row b{color:var(--fg);font-weight:400}
  #quest{border-top:2px solid var(--warn);margin-top:12px;padding-top:12px;font-size:9px;line-height:1.8}
  #quest .lead{color:var(--warn);letter-spacing:.14em;font-size:8px;display:block;margin-bottom:6px}
  #quest .q{color:var(--fg);line-height:1.75}
  #quest .mv{color:var(--dim);margin-top:7px}
  #quest .mv b{color:var(--hot);font-weight:400}
  #foot{position:fixed;left:0;right:318px;bottom:0;height:52px;z-index:40;
    border-top:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px;
    color:var(--dim);font-size:9px;letter-spacing:.11em}
  #shout{color:var(--hot);opacity:0;transition:opacity .35s;margin-left:auto}
  #shout.on{opacity:1}
</style>
</head>
<body>

<div id="head">
  <div class="brand">256 / DRAFT 03<i>COORDINATE SPACE — 16×16, EVERY ADDRESS HOLDS EXACTLY ONE ITEM</i></div>
  <span class="lbl">GO TO</span><input id="cmd" placeholder="A1" maxlength="4">
  <button class="btn" id="bShow">SHOW ALL</button>
  <div class="sorts">
    <button class="btn on" data-s="rank">RANK</button>
    <button class="btn" data-s="category">SUBJECT</button>
    <button class="btn" data-s="colour">COLOUR</button>
    <button class="btn" data-s="meaning">MEANING</button>
  </div>
</div>

<div id="field"><div id="board"></div></div>

<div id="side">
  <div id="prev">NOTHING SELECTED</div>
  <div id="meta"></div>
  <div id="quest"></div>
</div>

<div id="foot">
  <span>↑↓←→ / WASD</span><span>TYPE AN ADDRESS + ENTER</span>
  <span>RE-SORTING RE-ADDRESSES EVERY ITEM</span>
  <span id="shout"></span>
</div>

<script src="../assets/data.js"></script>
<script>
/* ------------------------------------------------------------------
   256 items, 256 cells: the archive is exactly addressable. Nothing
   is hidden by scarcity — what is hidden is which item sits where.
   Changing the sort rewrites every address at once, which is the
   whole argument: a grid is an addressing scheme, not a picture.
------------------------------------------------------------------ */

const SIDE=META.side;                 /* 16 */
const BANDC={order:'#4da3ff',inhabited:'#ffc84d',pressure:'#ff4d2e'};
const HUE=h=>h<20||h>=330?0:h<45?1:h<70?2:h<160?3:h<200?4:h<255?5:6;

let sort='rank', showAll=false, cx=0, cy=0, moves=0, target=null;
let order=[];                          /* address index -> item */
const seen=new Set();

const L=c=>String.fromCharCode(65+c);
const addr=(x,y)=>L(x)+(y+1);
const ix=(x,y)=>y*SIDE+x;

const SORTS={
  rank:    a=>a.slice().sort((p,q)=>p.rank-q.rank),
  category:a=>a.slice().sort((p,q)=>p.category.localeCompare(q.category)||p.rank-q.rank),
  colour:  a=>a.slice().sort((p,q)=>HUE(p.h)-HUE(q.h)||q.l-p.l),
  meaning: a=>a.slice().sort((p,q)=>META.meanings.indexOf(p.meaning)-META.meanings.indexOf(q.meaning)||p.rank-q.rank),
};

function build(){ order=SORTS[sort](DATA); }

const board=document.getElementById('board');
function cellSize(){
  const f=document.getElementById('field');
  return Math.floor(Math.min((f.clientWidth-70)/SIDE,(f.clientHeight-52)/SIDE));
}

function render(){
  const s=cellSize();
  board.style.width=(s*SIDE)+'px'; board.style.height=(s*SIDE)+'px';
  let h='';
  for(let y=0;y<SIDE;y++)for(let x=0;x<SIDE;x++){
    const i=ix(x,y), d=order[i];
    const cls=['c']; if(seen.has(i))cls.push('seen'); if(showAll)cls.push('showall');
    if(x===cx&&y===cy)cls.push('cur');
    if(target&&d&&d.id===target.id&&(seen.has(i)||showAll))cls.push('target');
    h+=`<div class="${cls.join(' ')}" data-i="${i}"
      style="left:${x*s}px;top:${y*s}px;width:${s}px;height:${s}px">
      <div class="th"><img src="${THUMB(d.thumb)}" loading="lazy" alt=""></div>
      <div class="tint" style="background:${BANDC[d.spectrum]}"></div></div>`;
  }
  for(let x=0;x<SIDE;x++)h+=`<div class="ruler ${x===cx?'on':''}" style="left:${x*s+s/2-4}px;top:-15px">${L(x)}</div>`;
  for(let y=0;y<SIDE;y++)h+=`<div class="ruler ${y===cy?'on':''}" style="left:-20px;top:${y*s+s/2-5}px">${y+1}</div>`;
  board.innerHTML=h;
  board.querySelectorAll('.c').forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i; cx=i%SIDE; cy=(i/SIDE)|0; go();
  });
}

function go(){
  const i=ix(cx,cy); seen.add(i); moves++;
  const d=order[i];
  render(); info(d); quest();
  if(target&&d.id===target.id){ shout(`FOUND IT AT ${addr(cx,cy)} — ${moves} MOVES`); newTarget(); }
}

function info(d){
  document.getElementById('prev').innerHTML=`<img src="${THUMB(d.thumb)}" alt="">`;
  document.getElementById('meta').innerHTML=
    `<span class="t">${d.title}</span>
     <div class="row"><span>address</span><b style="color:var(--hot)">${addr(cx,cy)}</b></div>
     <div class="row"><span>rank</span><b>${d.rank}</b></div>
     <div class="row"><span>band</span><b>${META.bandLabels[d.spectrum]}</b></div>
     <div class="row"><span>meaning</span><b>${d.meaning}</b></div>
     <div class="row"><span>subject</span><b>${d.category}</b></div>
     <div class="row"><span>register</span><b>${d.world?'real-world':'graphic'}</b></div>
     <div class="row"><span>colour</span><b>${d.hex}</b></div>
     ${d.animated?`<div class="row"><span></span><b style="color:var(--warn)">ANIMATED</b></div>`:''}
     <div class="row"><span>seen</span><b>${seen.size} / ${SIDE*SIDE}</b></div>`;
}

function newTarget(){
  target=DATA[Math.floor(Math.random()*DATA.length)]; moves=0; quest();
}
function quest(){
  if(!target) return;
  const pos=order.findIndex(o=>o.id===target.id);
  const found=seen.has(pos);
  document.getElementById('quest').innerHTML=
    `<span class="lead">FIND THIS ITEM</span>
     <div class="q">${target.title}</div>
     <div class="mv">band <b>${target.spectrum}</b> · meaning <b>${target.meaning}</b>
       · subject <b>${target.category}</b></div>
     <div class="mv">moves <b>${moves}</b>${found?` · it is at <b>${addr(pos%SIDE,(pos/SIDE)|0)}</b>`:''}</div>
     <div class="mv" style="margin-top:8px;opacity:.7">Its address depends on the sort.
       Switch the sort and it moves.</div>`;
}

let st; function shout(m){
  const e=document.getElementById('shout'); e.textContent=m; e.classList.add('on');
  clearTimeout(st); st=setTimeout(()=>e.classList.remove('on'),2200);
}

addEventListener('keydown',e=>{
  if(document.activeElement===document.getElementById('cmd'))return;
  const k=e.key.toLowerCase(); let m=true;
  if(k==='arrowleft'||k==='a')cx=Math.max(0,cx-1);
  else if(k==='arrowright'||k==='d')cx=Math.min(SIDE-1,cx+1);
  else if(k==='arrowup'||k==='w')cy=Math.max(0,cy-1);
  else if(k==='arrowdown'||k==='s')cy=Math.min(SIDE-1,cy+1);
  else m=false;
  if(m){e.preventDefault();go()}
});
document.getElementById('cmd').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim().toUpperCase(), mm=v.match(/^([A-Z])(\d{1,2})$/);
  if(!mm)return shout('BAD ADDRESS');
  const x=mm[1].charCodeAt(0)-65, y=+mm[2]-1;
  if(x<0||x>=SIDE||y<0||y>=SIDE)return shout(`${v} IS OUTSIDE THE FIELD`);
  cx=x;cy=y;e.target.value='';e.target.blur();go();
});
document.getElementById('bShow').onclick=e=>{
  showAll=!showAll; e.target.classList.toggle('on',showAll); render();
};
document.querySelectorAll('.sorts .btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sorts .btn').forEach(o=>o.classList.remove('on'));
  b.classList.add('on'); sort=b.dataset.s; build(); render();
  info(order[ix(cx,cy)]); quest();
  shout(`RE-SORTED BY ${sort.toUpperCase()} — EVERY ADDRESS HAS CHANGED`);
});
addEventListener('resize',render);

build(); render(); newTarget(); go();
</script>
</body>
</html>
