<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom — draft 2, the snap</title>
<link rel="stylesheet" href="loom.css">
<style>
  /* ---- draft 2: the card you were already using becomes the sidebar ---- */
  #veil{position:fixed;inset:0;z-index:41000;background:var(--bg);transition:opacity .7s ease}
  #veil.gone{opacity:0;pointer-events:none}

  #box{position:fixed;left:26px;bottom:26px;width:440px;z-index:19500;
       padding:16px 16px 14px;border-radius:11px;overflow:hidden;
       transition:left .78s cubic-bezier(.3,.8,.25,1),top .78s cubic-bezier(.3,.8,.25,1),
                  width .78s cubic-bezier(.3,.8,.25,1),height .78s cubic-bezier(.3,.8,.25,1),
                  padding .78s ease,border-radius .78s ease,box-shadow .78s ease,
       opacity .7s ease,transform .7s ease;
       opacity:0;transform:translateY(16px)}
  #box.up{opacity:1;transform:none}

  /* the snap: same element, new home */
  #box.open{left:0!important;top:0!important;width:330px!important;height:100vh!important;
            padding:22px 18px 28px!important;border-radius:0 16px 16px 0!important;
            overflow-y:auto;border-width:0 1px 0 0;
            box-shadow:18px 0 50px rgba(0,0,0,.45)!important}
  #box::-webkit-scrollbar{width:7px}
  #box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

  #bhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
         margin-bottom:14px}
  #snapback{padding:5px 9px;font-size:11px;border-radius:5px;color:var(--soft);
            opacity:0;pointer-events:none;transition:opacity .4s ease}
  #box.open #snapback{opacity:1;pointer-events:auto;transition-delay:.5s}

  /* everything past the first rule waits until you have asked to come in */
  .more{max-height:0;opacity:0;overflow:hidden;
        transition:max-height .7s cubic-bezier(.3,.8,.25,1),opacity .45s ease}
  #box.open .more{max-height:1400px;opacity:1;transition-delay:0s,.28s}

  #teaser{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge);
          display:flex;align-items:center;justify-content:space-between;gap:14px;
          max-height:70px;opacity:1;overflow:hidden;
          transition:max-height .5s ease,opacity .3s ease,margin .5s ease,padding .5s ease}
  #box.open #teaser{max-height:0;opacity:0;margin-top:0;padding-top:0;border-color:transparent}
  #teaser p{margin:0;font-size:11.5px;color:var(--soft);line-height:1.45}
  #explore{flex:none;padding:10px 20px;font-size:13px;border-radius:6px;
           border-color:rgba(255,255,255,.34)}

  #readout{margin-top:16px;padding-top:13px;border-top:1px solid var(--edge);
           font-size:11px;color:var(--soft);line-height:1.5;min-height:32px}
  #readout b{color:var(--fg);font-weight:500}
</style>
</head>
<body>

<canvas id="floor"></canvas>
<div id="world"></div>
<canvas id="wire"></canvas>

<div id="box" class="panel chrome">
  <div id="bhead">
    <div class="mark"><b>Loom</b><span>image mapping tool</span></div>
    <button class="btn" id="snapback">Shrink</button>
  </div>
  <div id="controls"></div>
  <div id="teaser">
    <p>Pick a view and an order to get a feel for it.<br>Explore opens the rest and moves the field across.</p>
    <button class="btn" id="explore">Explore</button>
  </div>
</div>

<div id="veil"></div>

<script src="../assets/loom.js"></script>
<script src="loom-core.js"></script>
<script src="loom-panel.js"></script>
<script>
/* ------------------------------------------------------------------
   Draft 2 — the snap.
   You start with a card in the corner that already works: choose a
   view, choose an order, watch the field answer. Ask for more and the
   same card walks to the left edge and unfolds into the full panel,
   while the field slides across to sit in what is left.
------------------------------------------------------------------ */
const SIDE = 330;

const loom = Loom.mount({
  world: document.getElementById('world'),
  wire:  document.getElementById('wire'),
  floor: document.getElementById('floor'),
  view: 'timeline', sort: 'colour',
  onView: v => panel.onView(v),
  onZoom: () => panel.onZoom(),
  onColumn: k => say(k ? 'Column <b>' + k + '</b>' : ''),
  onHold: (i, ln) => say('<b>' + DATA[i].title.replace(/-/g, ' ') + '</b> — ' +
                         ln.length + ' threads out. Click it again to let go.'),
  onRelease: () => say('')
});

const host = document.getElementById('controls');
const panel = Panel.build(host, loom);

/* fold everything from the first rule down into the part that waits */
const kids = Array.prototype.slice.call(host.children);
const cut = kids.findIndex(k => k.classList.contains('rule'));
const more = document.createElement('div');
more.className = 'more';
kids.slice(cut).forEach(k => more.appendChild(k));
host.appendChild(more);

const read = document.createElement('div');
read.id = 'readout';
more.appendChild(read);
const say = h => read.innerHTML = h ||
  'Hover a picture to see what it is tied to. Click to hold it, click a thread to follow it.';
say('');

/* ---------- the snap ---------- */
const box = document.getElementById('box');
let open = false;

function snapOpen(){
  if (open) return;
  open = true;
  /* fix the card where it already is, so there is something to animate from */
  const r = box.getBoundingClientRect();
  box.style.top = r.top + 'px';
  box.style.left = r.left + 'px';
  box.style.width = r.width + 'px';
  box.style.height = r.height + 'px';
  box.style.bottom = 'auto';
  void box.offsetHeight;                   /* flush the fixed geometry, then move */
  box.classList.add('open');
  slide(0, SIDE, 780);
}
function snapShut(){
  if (!open) return;
  open = false;
  box.classList.remove('open');
  slide(SIDE, 0, 780);
  setTimeout(() => {                       /* hand the corner back to the stylesheet */
    box.style.top = box.style.left = box.style.width = box.style.height = box.style.bottom = '';
  }, 820);
}
/* the field re-centres into whatever room is left */
function slide(from, to, T){
  const t0 = performance.now();
  (function step(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    loom.setInset({ left: from + (to - from) * e });
    if (u < 1) requestAnimationFrame(step);
  })(t0);
}
document.getElementById('explore').onclick = e => { e.stopPropagation(); snapOpen(); };
document.getElementById('snapback').onclick = e => { e.stopPropagation(); snapShut(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ loom.pinned >= 0 ? loom.release() : snapShut(); }
});

loom.ready(() => {
  document.getElementById('veil').classList.add('gone');
  /* a forced reflow, not requestAnimationFrame: rAF is suspended while the tab
     is hidden, so the card would never rise if the page opened in a background tab */
  void box.offsetHeight;
  box.classList.add('up');
});
</script>
</body>
</html>
