<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Field</title>
<style>
  :root{
    --bg:#0d0d0f; --fg:#f2f1ee; --soft:#7d7a75;
    --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12px;
       overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab}
  body.drag{cursor:grabbing}

  #wire{position:fixed;inset:0;pointer-events:none;z-index:5}
  #world{position:fixed;inset:0}

  .node{position:absolute;will-change:transform;cursor:pointer}
  .node img{display:block;width:100%;height:100%;object-fit:cover;background:#1a1a1d;
    transition:none}
  .node.on img{box-shadow:0 10px 44px rgba(0,0,0,.6)}
  .node.on{z-index:9999!important}

  /* ---------- chrome ---------- */
  .panel{position:fixed;z-index:40}
  .brand{left:26px;bottom:22px;font-size:11px;letter-spacing:.03em;color:var(--soft)}
  .made{right:26px;bottom:22px;font-size:11px;color:var(--soft)}

  #viewby{left:26px;top:50%;transform:translateY(-50%);
          background:rgba(20,20,23,.72);backdrop-filter:blur(9px);
          padding:14px 16px 13px;border-radius:9px;width:196px}
  #viewby h4{margin:0 0 10px;font-size:11px;color:var(--soft);font-weight:400}
  .rw{display:flex;align-items:center;gap:9px;padding:4px 0;cursor:pointer;user-select:none;
      color:var(--fg);font-size:12px}
  .rw i{width:9px;height:9px;border-radius:50%;flex:none}
  .rw b{font-weight:400;flex:1}
  .rw.off{opacity:.34}
  .rw:hover{opacity:1}

  #meta{right:26px;top:50%;transform:translateY(-50%);display:none;
        background:rgba(20,20,23,.72);backdrop-filter:blur(9px);
        padding:14px 16px;border-radius:9px;min-width:214px;max-width:264px}
  #meta .r{display:flex;gap:16px;padding:2px 0;font-size:12px}
  #meta .r span{color:var(--soft);width:64px;flex:none}
  #meta .r b{font-weight:500;flex:1}
  #meta .ties{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
              font-size:11px;color:var(--soft);line-height:1.7}
  #meta .ties em{font-style:normal}

  .hint{left:50%;top:22px;transform:translateX(-50%);font-size:11px;color:var(--soft)}

  #boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;
        align-items:center;justify-content:center;flex-direction:column;gap:9px;
        transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .n{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #boot .s{font-size:11px;color:var(--soft)}
</style>
</head>
<body>

<div id="world"></div>
<canvas id="wire"></canvas>

<div class="panel hint">hover a picture to see what it is tied to</div>
<div class="panel" id="viewby"><h4>View by</h4><div id="rlist"></div></div>
<div class="panel" id="meta"></div>
<div class="panel brand">256 Project, CD Thesis</div>
<div class="panel made" id="made"></div>

<div id="boot"><div class="n" id="bootn">Welcome…</div><div class="s" id="boots">0 of 144</div></div>

<script src="../assets/data9.js?b=1"></script>
<script>
/* ------------------------------------------------------------------
   Five relationships, five colours, all drawn at once. Any two
   pictures can be joined by more than one line — a picture of a
   crowd and a woven textile might share a measure and a texture but
   nothing else. Hovering shows everything one picture is tied to.
------------------------------------------------------------------ */

const world = document.getElementById('world');
const cv = document.getElementById('wire'), ctx = cv.getContext('2d');
const TILE = META.tile, B = META.bounds;

let camX = (B[0] + B[2]) / 2, camY = (B[1] + B[3]) / 2;
let dist = 2100, focal = 1400;
let drag = false, lx = 0, ly = 0, moved = false;
let hot = -1, off = new Set();

const LG = d => Math.log2(Math.max(1, d.cells));

/* ---------- who is tied to whom, and by what ---------- */
const near = (key, k) => {
  const out = [];
  for (let i = 0; i < DATA.length; i++) {
    const o = DATA.map((d, j) => j).filter(j => j !== i)
      .sort((a, b) => Math.abs(key(DATA[a]) - key(DATA[i])) - Math.abs(key(DATA[b]) - key(DATA[i])));
    out.push(o.slice(0, k));
  }
  return out;
};
const NEAR_M = near(LG, 12);
const NEAR_T = near(d => d.grain, 12);

function tiesOf(i){
  const d = DATA[i], out = [];
  const add = (j, rel) => { if (j !== i) out.push([j, rel]); };
  DATA.forEach((o, j) => { if (o.theme === d.theme) add(j, 'theme'); });
  NEAR_M[i].forEach(j => add(j, 'measure'));
  NEAR_T[i].forEach(j => add(j, 'texture'));
  DATA.forEach((o, j) => { if (o.band === d.band && (i + j) % 3 === 0) add(j, 'spectrum'); });
  DATA.forEach((o, j) => { if (o.world === d.world && (i + j) % 5 === 0) add(j, 'register'); });
  return out.filter(([, rel]) => !off.has(rel));
}

/* a thin resting web so the field is never empty */
const WEB = [];
DATA.forEach((d, i) => {
  NEAR_M[i].slice(0, 2).forEach(j => WEB.push([i, j, 'measure']));
  NEAR_T[i].slice(0, 2).forEach(j => WEB.push([i, j, 'texture']));
  const sameTheme = DATA.map((o, j) => j).filter(j => j !== i && DATA[j].theme === d.theme);
  sameTheme.slice(0, 2).forEach(j => WEB.push([i, j, 'theme']));
});

/* ---------- pictures ---------- */
const nodes = DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML = `<img src="${THUMB(d.thumb)}" alt="">`;
  el.addEventListener('mouseenter', () => { hot = i; paint(); });
  el.addEventListener('mouseleave', () => { hot = -1; paint(); });
  el.addEventListener('click', () => { if (!moved && d.live) window.open(d.live, '_blank'); });
  world.appendChild(el);
  return el;
});

function project(x, y, z){
  const d = z + dist;
  if (d < 80) return null;
  const s = focal / d;
  return { x: innerWidth / 2 + (x - camX) * s, y: innerHeight / 2 + (y - camY) * s, s, d };
}
const refScale = () => focal / dist;
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
};

function paint(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const P = DATA.map(d => project(d.x, d.y, d.z));

  /* pictures first — the lines are drawn over them, as in the reference */
  DATA.map((_, i) => i).filter(i => P[i]).sort((a, b) => P[b].d - P[a].d).forEach(i => {
    const p = P[i], el = nodes[i], w = TILE * p.s;
    const grow = i === hot ? 1.34 : 1;
    const ww = w * grow, hh = w * .78 * grow;
    el.style.transform = `translate(${p.x - ww / 2}px,${p.y - hh / 2}px)`;
    el.style.width = ww + 'px'; el.style.height = hh + 'px';
    el.style.opacity = hot < 0 ? Math.max(.52, Math.min(1, 1.55 - p.d / (dist * 2.8)))
                               : (i === hot ? 1 : .42);
    el.style.zIndex = 1000 - Math.round(p.d / 4);
    el.classList.toggle('on', i === hot);
  });

  ctx.lineWidth = 1;
  if (hot < 0){
    WEB.forEach(([a, b, rel]) => {
      if (off.has(rel)) return;
      const pa = P[a], pb = P[b];
      if (!pa || !pb) return;
      ctx.strokeStyle = rgba(META.rel[rel].color, .30);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    });
  } else {
    WEB.forEach(([a, b, rel]) => {
      if (off.has(rel)) return;
      const pa = P[a], pb = P[b];
      if (!pa || !pb) return;
      ctx.strokeStyle = rgba(META.rel[rel].color, .07);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    });
    const p0 = P[hot];
    tiesOf(hot).forEach(([j, rel]) => {
      const pj = P[j];
      if (!p0 || !pj) return;
      ctx.strokeStyle = rgba(META.rel[rel].color, .82);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(pj.x, pj.y); ctx.stroke();
    });
    showMeta(hot);
  }
  if (hot < 0) document.getElementById('meta').style.display = 'none';
}

function showMeta(i){
  const d = DATA[i], t = tiesOf(i);
  const by = {};
  t.forEach(([, rel]) => by[rel] = (by[rel] || 0) + 1);
  const el = document.getElementById('meta');
  el.style.display = 'block';
  el.innerHTML =
    `<div class="r"><span>Title</span><b>${d.title}</b></div>
     <div class="r"><span>Theme</span><b>${d.theme}</b></div>
     <div class="r"><span>Subject</span><b>${d.cat}</b></div>
     <div class="r"><span>Divisions</span><b>${d.v} × ${d.h} — ${d.cells}</b></div>
     <div class="ties">tied to <em style="color:#fff">${t.length}</em> pictures —
       ${META.relOrder.filter(r => by[r]).map(r =>
         `<em style="color:${META.rel[r].color}">${by[r]} ${META.rel[r].label.toLowerCase()}</em>`
       ).join(', ')}</div>`;
}

/* ---------- view by ---------- */
document.getElementById('rlist').innerHTML = META.relOrder.map(r =>
  `<div class="rw" data-r="${r}"><i style="background:${META.rel[r].color}"></i>
     <b>${META.rel[r].label}</b></div>`).join('');
document.querySelectorAll('.rw').forEach(el => el.onclick = () => {
  const r = el.dataset.r;
  off.has(r) ? off.delete(r) : off.add(r);
  el.classList.toggle('off', off.has(r));
  paint();
});

document.getElementById('made').textContent = `${META.total} pictures`;

/* ---------- navigation ---------- */
addEventListener('mousedown', e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('drag'); });
addEventListener('mouseup', () => { drag = false; document.body.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) moved = true;
  const s = refScale();
  camX -= (e.clientX - lx) / s; camY -= (e.clientY - ly) / s;
  lx = e.clientX; ly = e.clientY; paint();
});
addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(420, Math.min(6000, dist * (e.deltaY > 0 ? 1.075 : .93)));
  paint();
}, { passive: false });
addEventListener('resize', paint);

let loaded = 0;
world.querySelectorAll('img').forEach(img => {
  const tick = () => {
    document.getElementById('boots').textContent = `${++loaded} of ${DATA.length}`;
    if (loaded >= DATA.length) {
      paint();
      setTimeout(() => document.getElementById('boot').classList.add('gone'), 250);
    }
  };
  img.complete ? tick() : (img.onload = tick, img.onerror = tick);
});
paint();
</script>
</body>
</html>
