<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Islands</title>
<style>
  :root{
    --paper:#eae8e2; --ink:#131210; --soft:#8b8779;
    --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab}
  body.drag{cursor:grabbing}

  #wire{position:fixed;inset:0;pointer-events:none}
  #world{position:fixed;inset:0}

  .node{position:absolute;will-change:transform;cursor:pointer}
  .node img{display:block;width:100%;height:100%;object-fit:cover;background:#d9d5ca;
    border:2px solid;box-sizing:border-box}
  .node .ring{position:absolute;inset:-5px;border:1.5px solid;opacity:0;transition:opacity .14s}
  .node .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);
    margin-top:7px;white-space:nowrap;opacity:0;transition:opacity .14s;
    text-align:center;pointer-events:none}
  .node .tag b{display:block;font-weight:500;font-size:12px;letter-spacing:-.01em;
    max-width:230px;white-space:normal;line-height:1.3}
  .node .tag i{font-style:normal;display:block;font-size:10px;color:var(--soft);margin-top:3px}
  .node.on .ring,.node.on .tag{opacity:1}

  .isle{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
        font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
        white-space:nowrap}
  .isle em{font-style:normal;opacity:.55;margin-left:6px;letter-spacing:.06em}

  /* ---------- minimal chrome ---------- */
  .brand{position:fixed;left:24px;top:20px;z-index:30;font-size:30px;line-height:1;
         letter-spacing:-.035em;font-weight:600}
  .legend{position:fixed;left:24px;bottom:20px;z-index:30;display:flex;gap:14px;
          flex-wrap:wrap;max-width:62vw}
  .lg{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.05em;
      color:var(--soft);cursor:pointer;user-select:none}
  .lg i{width:8px;height:8px;border-radius:50%;display:block}
  .lg.mute{opacity:.3}
  .lg:hover{color:var(--ink)}
  .note{position:fixed;right:24px;bottom:20px;z-index:30;text-align:right;
        font-size:10px;color:var(--soft);line-height:1.75}
  .note b{color:var(--ink);font-weight:500}
  .hint{position:fixed;right:24px;top:22px;z-index:30;font-size:10px;color:var(--soft);
        text-align:right;line-height:1.7}
</style>
</head>
<body>

<canvas id="wire"></canvas>
<div id="world"></div>

<div class="brand">256</div>
<div class="hint">drag to turn · scroll to move in<br>hover to follow a tie</div>
<div class="legend" id="legend"></div>
<div class="note" id="note"></div>

<script src="../assets/data8.js?b=1"></script>
<script>
/* ------------------------------------------------------------------
   Islands are themes. Height inside an island is how finely the
   picture is divided. A tie joins two pictures cut into a similar
   number of cells — which is why nearly all of them leave the island.
------------------------------------------------------------------ */

const world = document.getElementById('world');
const cv = document.getElementById('wire'), ctx = cv.getContext('2d');
const TILE = META.tile;

let yaw = 0.5, pitch = -0.46, dist = 4600, focal = 1500;
let drag = false, lx = 0, ly = 0, moved = false, idle = 0;
let k = 3, hot = -1, muted = new Set();

/* ---------- nodes ---------- */
const nodes = DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML =
    `<img src="${THUMB(d.thumb)}" loading="lazy" alt="" style="border-color:${d.tc}">
     <div class="ring" style="border-color:${d.tc}"></div>
     <div class="tag"><b>${d.title}</b><i></i></div>`;
  el.addEventListener('mouseenter', () => { hot = i; paint(); });
  el.addEventListener('mouseleave', () => { hot = -1; paint(); });
  el.addEventListener('click', () => { if (!moved && d.live) window.open(d.live, '_blank'); });
  world.appendChild(el);
  return el;
});

/* ---------- island labels ---------- */
const isles = META.themes.map(t => {
  const el = document.createElement('div');
  el.className = 'isle';
  el.style.color = META.color[t];
  el.innerHTML = `${t}<em>${META.themeCounts[t] || 0}</em>`;
  world.appendChild(el);
  return { t, el, p: META.centroids[t] };
});

/* ---------- 3d ---------- */
function project(x, y, z){
  const cy = Math.cos(yaw),  sy = Math.sin(yaw);
  let X = x * cy - z * sy, Z = x * sy + z * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let Y = y * cp - Z * sp;  Z = y * sp + Z * cp;
  const d = Z + dist;
  if (d < 120) return null;
  const s = focal / d;
  return { x: innerWidth / 2 + X * s, y: innerHeight / 2 + Y * s, s, d };
}

function kinOf(i){
  const s = new Set();
  META.edges[String(k)].forEach(([a, b]) => { if (a === i) s.add(b); if (b === i) s.add(a); });
  return s;
}

function paint(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const P = DATA.map(d => project(d.x, d.y, d.z));
  const kin = hot >= 0 ? kinOf(hot) : null;
  const live = i => !muted.has(DATA[i].theme);

  /* ties first, so pictures sit on top of them */
  META.edges[String(k)].forEach(([a, b]) => {
    const pa = P[a], pb = P[b];
    if (!pa || !pb || !live(a) || !live(b)) return;
    const on = hot >= 0 && (a === hot || b === hot);
    if (hot >= 0 && !on) { ctx.strokeStyle = 'rgba(19,18,16,.07)'; ctx.lineWidth = 1; }
    else if (on)        { ctx.strokeStyle = DATA[hot].tc;          ctx.lineWidth = 1.6; }
    else                { ctx.strokeStyle = 'rgba(19,18,16,.24)';  ctx.lineWidth = 1; }
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });

  /* pictures, far to near */
  const order = DATA.map((_, i) => i).filter(i => P[i]).sort((a, b) => P[b].d - P[a].d);
  order.forEach(i => {
    const p = P[i], el = nodes[i], d = DATA[i];
    const w = TILE * p.s;
    const dim = !live(i) ? .06
              : hot < 0 ? Math.max(.30, Math.min(1, 1.55 - p.d / (dist * 1.5)))
              : (i === hot ? 1 : kin.has(i) ? .95 : .13);
    el.style.transform = `translate(${p.x - w / 2}px,${p.y - w / 2}px)`;
    el.style.width = w + 'px'; el.style.height = w + 'px';
    el.style.opacity = dim;
    el.style.zIndex = 10000 - Math.round(p.d);
    el.classList.toggle('on', i === hot);
    if (i === hot) {
      const names = [...kin].filter(live).map(j => DATA[j].theme);
      const other = [...new Set(names)].filter(t => t !== d.theme);
      el.querySelector('.tag i').textContent =
        `${d.cells} cells · ${d.theme}` +
        (other.length ? ` → ties to ${other.join(', ')}` : '');
    }
  });

  isles.forEach(o => {
    const p = project(o.p[0], o.p[1] - 620, o.p[2]);
    if (!p) { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = muted.has(o.t) ? .25 : Math.max(.25, Math.min(.95, p.s * 2.1));
    o.el.style.fontSize = Math.max(9, Math.min(15, 11 * p.s * 2.2)) + 'px';
  });
}

/* ---------- interaction ---------- */
addEventListener('mousedown', e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('drag'); });
addEventListener('mouseup', () => { drag = false; document.body.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) moved = true;
  yaw += (e.clientX - lx) * .005;
  pitch = Math.max(-.85, Math.min(.85, pitch + (e.clientY - ly) * .004));
  lx = e.clientX; ly = e.clientY; idle = 0; paint();
});
addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(700, Math.min(7000, dist * (e.deltaY > 0 ? 1.08 : .926)));
  idle = 0; paint();
}, { passive: false });

/* a slow drift so the depth reads without anyone touching it */
function loop(){
  idle++;
  if (idle > 90 && !drag && hot < 0) { yaw += .0011; paint(); }
  requestAnimationFrame(loop);
}

/* legend doubles as a theme filter */
document.getElementById('legend').innerHTML = META.themes.map(t =>
  `<div class="lg" data-t="${t}"><i style="background:${META.color[t]}"></i>${t}</div>`).join('');
document.querySelectorAll('.lg').forEach(el => el.onclick = () => {
  const t = el.dataset.t;
  muted.has(t) ? muted.delete(t) : muted.add(t);
  el.classList.toggle('mute', muted.has(t));
  paint();
});

document.getElementById('note').innerHTML =
  `<b>${META.total}</b> pictures in <b>${META.themes.length}</b> themes<br>
   <b>${META.crossShare}%</b> of ties leave their own theme`;

addEventListener('resize', paint);
paint(); loop();
</script>
</body>
</html>
