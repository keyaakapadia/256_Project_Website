<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom — draft 1, the cover</title>
<link rel="stylesheet" href="loom.css">
<style>
  /* ---- draft 1: the name sits over the thing itself, already moving ---- */
  #veil{position:fixed;inset:0;z-index:41000;background:var(--bg);transition:opacity .7s ease}
  #veil.gone{opacity:0;pointer-events:none}

  #cover{position:fixed;inset:0;z-index:30000;display:grid;place-items:center;
         pointer-events:none;                      /* the sphere still turns underneath */
         background:radial-gradient(ellipse at 50% 45%,rgba(20,20,20,.34) 0%,
                    rgba(20,20,20,.72) 46%,rgba(20,20,20,.9) 100%);
         transition:opacity .75s ease}
  #cover.gone{opacity:0}
  #cover .in{text-align:center;pointer-events:auto;padding:0 32px;max-width:940px}
  #cover h1{margin:0;font-size:clamp(62px,11vw,136px);font-weight:500;letter-spacing:-.045em;
            line-height:.92}
  #cover .sub{margin:14px 0 0;font-size:clamp(14px,1.5vw,18px);color:var(--soft);
              letter-spacing:.01em}

  /* the nine columns — the legend for every line in the field behind */
  #cols{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:44px auto 0;max-width:780px}
  #cols button{background:none;border:0;padding:10px 2px 0;cursor:pointer;font:inherit;
               color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:9px;
               transition:color .2s,opacity .25s}
  #cols button b{display:block;width:100%;height:3px;border-radius:2px;opacity:.5;
                 transform-origin:50% 100%;transition:opacity .25s,transform .25s}
  #cols button span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  #cols button:hover,#cols button.lit{color:var(--fg)}
  #cols button:hover b,#cols button.lit b{opacity:1;transform:scaleY(3.2)}
  #cols.dimmed button:not(.lit):not(:hover){opacity:.42}

  #go{margin-top:40px;padding:13px 30px;font-size:14px;border-radius:6px;
      border:1px solid rgba(255,255,255,.34)}
  #hint{margin-top:18px;font-size:11px;color:rgba(255,255,255,.34);letter-spacing:.04em}

  #cover .in > *{opacity:0;transform:translateY(14px);
                 transition:opacity .8s ease,transform .8s ease}
  #cover.up .in > *{opacity:1;transform:none}
  #cover.up .in > *:nth-child(1){transition-delay:.05s}
  #cover.up .in > *:nth-child(2){transition-delay:.16s}
  #cover.up .in > *:nth-child(3){transition-delay:.28s}
  #cover.up .in > *:nth-child(4){transition-delay:.40s}
  #cover.up .in > *:nth-child(5){transition-delay:.50s}

  /* ---- the panel it opens into ---- */
  #side{position:fixed;left:0;top:0;bottom:0;width:312px;z-index:19500;overflow-y:auto;
        padding:20px 18px 26px;border-width:0 1px 0 0;border-radius:0;
        transform:translateX(-100%);transition:transform .7s cubic-bezier(.22,.75,.28,1)}
  #side.in{transform:none}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  #head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  #back{padding:5px 9px;font-size:11px;border-radius:5px;color:var(--soft)}
  #readout{margin-top:16px;padding-top:13px;border-top:1px solid var(--edge);
           font-size:11px;color:var(--soft);line-height:1.5;min-height:32px}
  #readout b{color:var(--fg);font-weight:500}
</style>
</head>
<body class="cover">

<canvas id="floor"></canvas>
<div id="world"></div>
<canvas id="wire"></canvas>

<aside id="side" class="panel chrome">
  <div id="head">
    <div class="mark"><b>Loom</b><span>image mapping tool</span></div>
    <button class="btn" id="back">Cover</button>
  </div>
  <div id="controls"></div>
  <div id="readout"></div>
</aside>

<div id="cover"><div class="in chrome">
  <h1>Loom</h1>
  <p class="sub">150 grids, tied together by what they share.</p>
  <div id="cols"></div>
  <button class="btn" id="go">Explore</button>
  <div id="hint">drag to turn it · hover a colour to pull its threads forward</div>
</div></div>

<div id="veil"></div>

<script src="../assets/loom.js"></script>
<script src="loom-core.js"></script>
<script src="loom-panel.js"></script>
<script>
/* ------------------------------------------------------------------
   Draft 1 — the cover.
   The name sits over the working thing, which is already turning. The
   nine colours under it are the legend and the first control at once:
   touch one and every line that carries that meaning comes forward.
------------------------------------------------------------------ */
const SIDE = 312;

const loom = Loom.mount({
  world: document.getElementById('world'),
  wire:  document.getElementById('wire'),
  floor: document.getElementById('floor'),
  view: 'sphere', sort: 'colour', locked: true,
  onView: v => panel.onView(v),
  onZoom: () => panel.onZoom(),
  onColumn: k => say(k ? 'Column <b>' + k + '</b>' : ''),
  onHold: (i, ln) => say('<b>' + DATA[i].title.replace(/-/g, ' ') + '</b> — ' +
                         ln.length + ' threads out. Click it again to let go.'),
  onRelease: () => say('')
});

const panel = Panel.build(document.getElementById('controls'), loom);
const read = document.getElementById('readout');
const say = h => read.innerHTML = h || 'Hover a picture to see what it is tied to. Click to hold it.';
say('');

/* ---------- the cover's nine columns ---------- */
const cols = document.getElementById('cols');
cols.innerHTML = META.meanings.map(m =>
  '<button data-m="' + m + '"><b style="background:' + META.mcol[m] + '"></b>' +
  '<span>' + m + '</span></button>').join('');

let idle = null, cycle = 0, hovering = false;
const lift = m => {
  loom.setLit(m);
  cols.classList.toggle('dimmed', !!m);
  cols.querySelectorAll('button').forEach(b => b.classList.toggle('lit', b.dataset.m === m));
};
cols.querySelectorAll('button').forEach(b => {
  b.onmouseenter = () => { hovering = true; lift(b.dataset.m); };
  b.onmouseleave = () => { hovering = false; lift(null); };
  b.onclick = e => { e.stopPropagation(); enter(b.dataset.m); };
});
/* left alone, it walks the nine by itself — the motion at the back */
function startIdle(){
  idle = setInterval(() => {
    if (hovering) return;
    lift(META.meanings[cycle++ % META.meanings.length]);
  }, 2600);
}
function stopIdle(){ clearInterval(idle); idle = null; lift(null); }

/* ---------- the way in ---------- */
const cover = document.getElementById('cover'), side = document.getElementById('side');
let inside = false;

function enter(pickMeaning){
  if (inside) return;
  inside = true;
  stopIdle();
  loom.spin(0);
  loom.setLocked(false);
  document.body.classList.remove('cover');
  cover.classList.add('gone');
  setTimeout(() => cover.style.display = 'none', 800);
  side.classList.add('in');
  slide(0, SIDE, 700);
  if (pickMeaning) setTimeout(() => loom.setOnly(pickMeaning), 120);
}
function leave(){
  if (!inside) return;
  inside = false;
  loom.release(); loom.setOnly(null); loom.setLocked(true);
  loom.goTo('sphere'); panel.pickView('sphere');
  loom.spin(.0016);
  document.body.classList.add('cover');
  side.classList.remove('in');
  slide(SIDE, 0, 700);
  cover.style.display = '';
  void cover.offsetHeight;                 /* reflow, not rAF — see below */
  cover.classList.remove('gone');
  startIdle();
}
/* the field re-centres into whatever room is left */
function slide(from, to, T){
  const t0 = performance.now();
  (function step(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    loom.setInset({ left: from + (to - from) * e });
    if (u < 1) requestAnimationFrame(step);
  })(t0);
}
document.getElementById('go').onclick = e => { e.stopPropagation(); enter(); };
document.getElementById('back').onclick = e => { e.stopPropagation(); leave(); };
addEventListener('keydown', e => { if (e.key === 'Escape') inside ? leave() : null; else if (!inside) enter(); });

/* ---------- open ---------- */
loom.spin(.0016);                       /* a slow turn, not a spin */
loom.ready(() => {
  document.getElementById('veil').classList.add('gone');
  /* a forced reflow, not requestAnimationFrame: rAF is suspended while the tab
     is hidden, so a class flip scheduled inside one never lands and the cover
     would sit invisible until the tab came forward */
  void cover.offsetHeight;
  cover.classList.add('up');
  startIdle();
});
</script>
</body>
</html>
