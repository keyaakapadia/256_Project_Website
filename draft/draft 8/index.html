<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Kin</title>
<style>
  :root{
    --bg:#0b0b0c; --fg:#f4f3f0; --soft:#77746f; --line:rgba(255,255,255,.14);
    --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12px;
       overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab}
  body.drag{cursor:grabbing}

  #wire{position:fixed;inset:0;pointer-events:none;z-index:5}
  #world{position:fixed;inset:0}
  .node{position:absolute;will-change:transform;cursor:pointer}
  .node img{display:block;width:100%;height:100%;object-fit:cover;background:#191919}
  .node.on{z-index:9999!important}
  .node.on img{box-shadow:0 12px 50px rgba(0,0,0,.65)}

  .end{position:absolute;transform:translate(-50%,-50%);pointer-events:none;color:var(--soft);
       letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}

  .panel{position:fixed;z-index:40}
  .brand{left:20px;top:18px;font-size:12px;letter-spacing:.03em;color:var(--soft);
         background:rgba(11,11,12,.86);padding:8px 12px;border-radius:8px}
  .brand b{color:var(--fg);font-weight:500}
  .made{right:20px;bottom:18px;font-size:11px;color:var(--soft);text-align:right;line-height:1.8;
        background:rgba(11,11,12,.86);padding:9px 12px;border-radius:8px}

  #kin{left:20px;bottom:18px;width:262px;background:rgba(11,11,12,.86);
       backdrop-filter:blur(10px);padding:14px 16px 12px;border-radius:8px}
  #kin h4{margin:0 0 11px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--soft);font-weight:400}
  .kw{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;user-select:none;
      border-top:1px solid var(--line)}
  .kw i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
  .kw .b{flex:1}
  .kw .b em{font-style:normal;display:block;font-size:11px;font-weight:500;
            display:flex;justify-content:space-between;gap:8px}
  .kw .b em span{color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums}
  .kw .b small{display:block;color:var(--soft);font-size:10px;line-height:1.5;margin-top:3px}
  .kw.off{opacity:.3}
  .kw:hover{opacity:1}

  #meta{right:20px;top:18px;width:248px;display:none;background:rgba(11,11,12,.86);
        backdrop-filter:blur(10px);padding:14px 16px;border-radius:8px}
  #meta .t{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:10px}
  #meta .r{display:flex;gap:12px;font-size:11px;padding:3px 0;border-top:1px solid var(--line)}
  #meta .r span{color:var(--soft);width:66px;flex:none}
  #meta .r b{font-weight:400;flex:1;text-align:right}
  #meta .kin{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
             font-size:11px;line-height:1.85;color:var(--soft)}
  #meta .kin em{font-style:normal}

  #boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;
        justify-content:center;flex-direction:column;gap:8px;transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .s{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="world"></div>
<canvas id="wire"></canvas>

<div class="panel brand"><b>256</b> — one hundred and forty-four grids</div>
<div class="panel" id="kin"><h4>Kinship</h4><div id="klist"></div></div>
<div class="panel" id="meta"></div>
<div class="panel made" id="made"></div>

<div id="boot"><div class="s" id="boots">0 / 144</div></div>

<script src="../assets/data10.js?b=1"></script>
<script>
/* ------------------------------------------------------------------
   Position: x is the division count. Few cells at the left, many at
   the right. Nothing else is encoded in where a picture sits.

   Ties: three kinships, and a picture only ever gets its CLOSEST
   match in each — so a line means "nothing in the archive is nearer
   to this than that", not "these are vaguely similar".

   Colour: cyan, magenta, yellow. Halftone screening is itself a grid,
   and overlaying the three plates is how any printed image is made.
------------------------------------------------------------------ */

const world = document.getElementById('world');
const cv = document.getElementById('wire'), ctx = cv.getContext('2d');
const TILE = META.tile, B = META.bounds;

let camX = (B[0] + B[2]) / 2, camY = (B[1] + B[3]) / 2;
let dist = 3400, focal = 1400;
let drag = false, lx = 0, ly = 0, moved = false;
let hot = -1, off = new Set();

const ALL = [];
META.relOrder.forEach(r => META.ties[r].forEach(([a, b]) => ALL.push([a, b, r])));

const tiesOf = i => ALL.filter(([a, b, r]) => !off.has(r) && (a === i || b === i))
                       .map(([a, b, r]) => [a === i ? b : a, r]);

const nodes = DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML = `<img src="${THUMB(d.thumb)}" alt="">`;
  el.addEventListener('mouseenter', () => { hot = i; paint(); });
  el.addEventListener('mouseleave', () => { hot = -1; paint(); });
  el.addEventListener('click', () => { if (!moved && d.live) window.open(d.live, '_blank'); });
  world.appendChild(el);
  return el;
});

const ends = [['few divisions', B[0] - 300], ['many divisions', B[2] + 300]].map(([t, x]) => {
  const el = document.createElement('div');
  el.className = 'end'; el.textContent = t;
  world.appendChild(el);
  return { el, x };
});

function project(x, y, z){
  const d = z + dist;
  if (d < 80) return null;
  const s = focal / d;
  return { x: innerWidth / 2 + (x - camX) * s, y: innerHeight / 2 + (y - camY) * s, s, d };
}
const refScale = () => focal / dist;
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
};

function paint(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const P = DATA.map(d => project(d.x, d.y, d.z));

  DATA.map((_, i) => i).filter(i => P[i]).sort((a, b) => P[b].d - P[a].d).forEach(i => {
    const p = P[i], el = nodes[i], grow = i === hot ? 1.3 : 1;
    const w = TILE * p.s * grow, h = w * .78;
    el.style.transform = `translate(${p.x - w / 2}px,${p.y - h / 2}px)`;
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.opacity = hot < 0 ? Math.max(.5, Math.min(1, 1.5 - p.d / (dist * 2.8)))
                               : (i === hot ? 1 : .34);
    el.style.zIndex = 1000 - Math.round(p.d / 4);
    el.classList.toggle('on', i === hot);
  });

  ALL.forEach(([a, b, r]) => {
    if (off.has(r)) return;
    const pa = P[a], pb = P[b];
    if (!pa || !pb) return;
    const on = hot >= 0 && (a === hot || b === hot);
    const w = r === 'twin' ? 1.6 : 1;
    ctx.lineWidth = on ? w + 1 : w;
    ctx.strokeStyle = rgba(META.rel[r].color, hot < 0 ? (r === 'twin' ? .62 : .34) : (on ? .95 : .05));
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });

  ends.forEach(o => {
    const p = project(o.x, 0, 0);
    if (!p) { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = .75;
    o.el.style.fontSize = Math.max(10, Math.min(19, 13 * p.s * 1.5)) + 'px';
  });

  hot >= 0 ? showMeta(hot) : (document.getElementById('meta').style.display = 'none');
}

function showMeta(i){
  const d = DATA[i], t = tiesOf(i);
  const by = {}; t.forEach(([, r]) => by[r] = (by[r] || 0) + 1);
  const away = t.filter(([j]) => DATA[j].theme !== d.theme).length;
  const el = document.getElementById('meta');
  el.style.display = 'block';
  el.innerHTML =
    `<div class="t">${d.title}</div>
     <div class="r"><span>Subject</span><b>${d.cat}</b></div>
     <div class="r"><span>Divisions</span><b>${d.v} × ${d.h} = ${d.cells}</b></div>
     <div class="r"><span>Weave</span><b>${d.weave > .3 ? 'vertical' : d.weave < -.3 ? 'horizontal' : 'square'}</b></div>
     <div class="kin">${t.length
        ? META.relOrder.filter(r => by[r]).map(r =>
            `<em style="color:${META.rel[r].color}">${by[r]} ${META.rel[r].label.toLowerCase()}</em>`).join(' · ') +
          `<br>${away} of ${t.length} reach a different subject`
        : 'nothing in the archive is close enough to tie to'}</div>`;
}

document.getElementById('klist').innerHTML = META.relOrder.map(r => {
  const k = META.rel[r];
  return `<div class="kw" data-r="${r}">
    <i style="background:${k.color}"></i>
    <div class="b"><em>${k.label}<span>${k.n} · ${k.cross}% away</span></em>
    <small>${k.rule}</small></div></div>`;
}).join('');
document.querySelectorAll('.kw').forEach(el => el.onclick = () => {
  const r = el.dataset.r;
  off.has(r) ? off.delete(r) : off.add(r);
  el.classList.toggle('off', off.has(r));
  paint();
});

const total = META.relOrder.reduce((s, r) => s + META.rel[r].n, 0);
document.getElementById('made').innerHTML =
  `${DATA.length} pictures · ${total} ties · ${(2 * total / DATA.length).toFixed(1)} each<br>
   left to right: how many cells the picture is cut into`;

addEventListener('mousedown', e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('drag'); });
addEventListener('mouseup', () => { drag = false; document.body.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) moved = true;
  const s = refScale();
  camX -= (e.clientX - lx) / s; camY -= (e.clientY - ly) / s;
  lx = e.clientX; ly = e.clientY; paint();
});
addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(420, Math.min(7000, dist * (e.deltaY > 0 ? 1.075 : .93)));
  paint();
}, { passive: false });
addEventListener('resize', paint);

let loaded = 0;
world.querySelectorAll('img').forEach(img => {
  const tick = () => {
    document.getElementById('boots').textContent = `${++loaded} / ${DATA.length}`;
    if (loaded >= DATA.length) {
      paint();
      setTimeout(() => document.getElementById('boot').classList.add('gone'), 240);
    }
  };
  img.complete ? tick() : (img.onload = tick, img.onerror = tick);
});
paint();
</script>
</body>
</html>
