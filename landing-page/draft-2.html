<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom — draft 2, the snap</title>
<link rel="stylesheet" href="loom.css">
<style>
  /* ---- draft 2: the card you were already using becomes the sidebar ---- */
  #veil{position:fixed;inset:0;z-index:41000;background:var(--bg);transition:opacity .7s ease}
  #veil.gone{opacity:0;pointer-events:none}

  /* where it is going, shown before it goes */
  #rail{position:fixed;left:0;top:0;bottom:0;width:330px;z-index:19400;pointer-events:none;
        background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
        border-right:1px dashed rgba(255,255,255,.26);opacity:0;
        transform:translateX(-14px);
        transition:opacity .3s ease,transform .3s cubic-bezier(.3,.85,.25,1)}
  #rail.on{opacity:1;transform:none}
  /* high up, where the card in the corner is not already covering it */
  #rail span{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:10px;
             letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.42)}

  #box{position:fixed;left:26px;bottom:26px;width:446px;z-index:19500;
       padding:17px 17px 15px;border-radius:12px;overflow:hidden;
       opacity:0;transform:translateY(16px);
       /* going back: unfold down first, then walk to the corner */
       transition:height .44s cubic-bezier(.3,.85,.25,1),
                  top .44s cubic-bezier(.3,.85,.25,1),
                  left .58s cubic-bezier(.34,.9,.3,1) .22s,
                  width .58s cubic-bezier(.34,.9,.3,1) .22s,
                  padding .5s ease,border-radius .5s ease .22s,
                  box-shadow .6s ease,opacity .7s ease,transform .7s ease}
  #box.up{opacity:1;transform:none}

  /* the snap: the same element walks to the edge, then unfolds */
  #box.open{left:0!important;top:0!important;width:330px!important;height:100vh!important;
            padding:24px 18px 26px!important;border-radius:0 18px 18px 0!important;
            overflow-y:auto;border-width:0 1px 0 0;
            display:flex;flex-direction:column;
            box-shadow:22px 0 60px rgba(0,0,0,.5)!important;
            transition:left .58s cubic-bezier(.34,.9,.3,1),
                       width .58s cubic-bezier(.34,.9,.3,1),
                       border-radius .5s ease,
                       top .62s cubic-bezier(.3,.85,.25,1) .26s,
                       height .62s cubic-bezier(.3,.85,.25,1) .26s,
                       padding .5s ease .26s,
                       box-shadow .6s ease}
  #box::-webkit-scrollbar{width:7px}
  #box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

  #bhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
         margin-bottom:15px}
  #snapback{padding:6px 11px;font-size:11px;border-radius:6px;color:var(--soft);
            opacity:0;pointer-events:none;transition:opacity .4s ease}
  #box.open #snapback{opacity:1;pointer-events:auto;transition-delay:.7s}

  /* the key and the foot wait until you have asked to come in — out of flow,
     not just hidden, so the card's own height starts small enough to travel */
  #box:not(.open) .sec.key,#box:not(.open) .foot{display:none}
  #box.open #controls{flex:1;min-height:0}

  #teaser{margin-top:15px;padding-top:14px;border-top:1px solid var(--edge);
          display:flex;align-items:center;justify-content:space-between;gap:16px;
          max-height:76px;opacity:1;overflow:hidden;
          transition:max-height .45s ease,opacity .25s ease,margin .45s ease,padding .45s ease}
  #box.open #teaser{max-height:0;opacity:0;margin-top:0;padding-top:0;border-color:transparent}
  #teaser p{margin:0;font-size:11.5px;color:var(--soft);line-height:1.5}
  #explore{flex:none;display:flex;align-items:center;gap:9px;padding:11px 20px;font-size:13px;
           border-radius:7px;border-color:rgba(255,255,255,.34)}
  #explore i{font-style:normal;transition:transform .25s cubic-bezier(.3,.85,.25,1)}
  #explore:hover i{transform:translateX(-4px)}

  #readout{margin-bottom:12px;padding-bottom:13px;border-bottom:1px solid var(--edge);
           font-size:11px;color:var(--soft);line-height:1.55;min-height:30px}
  #readout b{color:var(--fg);font-weight:500}
</style>
</head>
<body>

<canvas id="floor"></canvas>
<div id="world"></div>
<canvas id="wire"></canvas>

<div id="rail"><span>the panel goes here</span></div>

<div id="box" class="panel chrome">
  <div id="bhead">
    <div class="mark"><b>Loom</b></div>
    <button class="btn" id="snapback">&larr; Shrink</button>
  </div>
  <div id="controls"></div>
  <div id="teaser">
    <p>Pick a view and an order to get a feel for it.<br>Explore sends this card to the edge and opens the rest.</p>
    <button class="btn" id="explore"><i>&larr;</i>Explore</button>
  </div>
</div>

<div id="veil"></div>

<script src="../assets/loom.js"></script>
<script src="loom-core.js"></script>
<script src="loom-panel.js"></script>
<script>
/* ------------------------------------------------------------------
   Draft 2 — the snap.
   You start with a card in the corner that already works. Hovering
   Explore shows you where it is going; pressing it walks the same card
   to the left edge, unfolds it into the full panel, and slides the
   field across into what is left.
------------------------------------------------------------------ */
const SIDE = 330;

const loom = Loom.mount({
  world: document.getElementById('world'),
  wire:  document.getElementById('wire'),
  floor: document.getElementById('floor'),
  view: 'timeline', sort: 'colour', motion: .3,
  onView: v => { panel.onView(v); say(''); },
  onSort: s => panel.onSort(s),
  onColumn: k => say(k ? 'Column <b>' + k + '</b>' : ''),
  onHold: (i, ln, open) => say('<b>' + DATA[i].title.replace(/-/g, ' ') + '</b> — ' +
                         ln.length + (open ? ' threads out. Click it again to let go.'
                                           : ' threads out. Click it again to read it.')),
  onRelease: () => say('')
});

const panel = Panel.build(document.getElementById('controls'), loom);
const read = document.createElement('div');
read.id = 'readout';
panel.foot.insertBefore(read, panel.foot.firstChild);
/* every view is bigger than the window on purpose, so each one says how to
   move around its own shape */
const base = () => loom.view === 'timeline'
  ? 'Drag sideways to run the strip — it loops for ever. Click a picture to gather its threads.'
  : loom.view === 'sphere'
  ? 'Drag to turn it. Click a picture to gather its threads, again to read it.'
  : 'Drag to move around it. Click a picture to gather its threads, again to read it.';
const say = h => read.innerHTML = h || base();
say('');

/* ---------- the snap ---------- */
const box = document.getElementById('box'), rail = document.getElementById('rail');
let open = false;

function snapOpen(){
  if (open) return;
  open = true;
  rail.classList.remove('on');
  /* fix the card where it already is, so there is something to travel from */
  const r = box.getBoundingClientRect();
  box.style.top = r.top + 'px';
  box.style.left = r.left + 'px';
  box.style.width = r.width + 'px';
  box.style.height = r.height + 'px';
  box.style.bottom = 'auto';
  void box.offsetHeight;                   /* flush that geometry, then move */
  box.classList.add('open');
  slide(0, SIDE, 900);
}
function snapShut(){
  if (!open) return;
  open = false;
  box.classList.remove('open');
  slide(SIDE, 0, 820);
  setTimeout(() => {                       /* hand the corner back to the stylesheet */
    box.style.top = box.style.left = box.style.width = box.style.height = box.style.bottom = '';
  }, 880);
}
/* the field re-frames into whatever room is left */
function slide(from, to, T){
  const t0 = performance.now();
  (function walk(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    loom.setInset({ left: from + (to - from) * e });
    if (u < 1) requestAnimationFrame(walk);
  })(t0);
}
const ex = document.getElementById('explore');
ex.onmouseenter = () => { if (!open) rail.classList.add('on'); };
ex.onmouseleave = () => rail.classList.remove('on');
ex.onclick = e => { e.stopPropagation(); snapOpen(); };
document.getElementById('snapback').onclick = e => { e.stopPropagation(); snapShut(); };
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  loom.pinned >= 0 ? loom.release() : snapShut();
});

loom.ready(() => {
  document.getElementById('veil').classList.add('gone');
  /* a forced reflow, not requestAnimationFrame: rAF is suspended while the tab
     is hidden, so the card would never rise if the page opened in a background tab */
  void box.offsetHeight;
  box.classList.add('up');
});
</script>
</body>
</html>
