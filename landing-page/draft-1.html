<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom — draft 1, the cover</title>
<link rel="stylesheet" href="loom.css">
<style>
  /* ---- draft 1: the name sits over the thing itself, already working ---- */
  #veil{position:fixed;inset:0;z-index:41000;background:var(--bg);transition:opacity .7s ease}
  #veil.gone{opacity:0;pointer-events:none}

  #cover{position:fixed;inset:0;z-index:30000;display:grid;place-items:center;
         pointer-events:none;                      /* the field still turns underneath */
         /* heavy enough in the middle to carry type over a moving field —
            the views shuffle underneath and some of them are very busy */
         background:radial-gradient(ellipse at 50% 46%,rgba(20,20,20,.62) 0%,
                    rgba(20,20,20,.84) 46%,rgba(20,20,20,.95) 100%);
         transition:opacity .75s ease}
  #cover.gone{opacity:0}
  #cover .in{text-align:center;pointer-events:auto;padding:0 32px;max-width:940px}
  #cover h1{margin:0;font-size:clamp(58px,10vw,126px);font-weight:500;letter-spacing:-.045em;
            line-height:.92}
  #cover .sub{margin:14px 0 0;font-size:clamp(14px,1.5vw,18px);color:var(--soft)}

  /* the nine columns — the legend for every line in the field behind */
  #cols{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:40px auto 0;max-width:760px}
  #cols button{background:none;border:0;padding:10px 2px 0;cursor:pointer;font:inherit;
               color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:9px;
               transition:color .2s,opacity .25s}
  #cols button b{display:block;width:100%;height:3px;border-radius:2px;opacity:.5;
                 transform-origin:50% 100%;transition:opacity .25s,transform .25s}
  #cols button span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  #cols button:hover,#cols button.lit{color:var(--fg)}
  #cols button:hover b,#cols button.lit b{opacity:1;transform:scaleY(3.2)}
  #cols.dimmed button:not(.lit):not(:hover){opacity:.4}

  /* the three things you can do, kept from the first build */
  .steps{display:flex;flex-direction:column;gap:9px;margin:34px auto 0;text-align:left;
         max-width:392px}
  .steps div{display:flex;align-items:baseline;gap:13px;font-size:14px;
             color:rgba(255,255,255,.62)}
  .steps b{flex:none;width:15px;font-weight:400;font-size:11.5px;
           color:rgba(255,255,255,.34);font-variant-numeric:tabular-nums}
  .steps em{font-style:normal;color:var(--fg)}

  #go{margin-top:36px;padding:13px 30px;font-size:14px;border-radius:7px;
      border:1px solid rgba(255,255,255,.34)}

  #cover .in > *{opacity:0;transform:translateY(14px);
                 transition:opacity .8s ease,transform .8s ease}
  #cover.up .in > *{opacity:1;transform:none}
  #cover.up .in > *:nth-child(1){transition-delay:.05s}
  #cover.up .in > *:nth-child(2){transition-delay:.16s}
  #cover.up .in > *:nth-child(3){transition-delay:.28s}
  #cover.up .in > *:nth-child(4){transition-delay:.40s}
  #cover.up .in > *:nth-child(5){transition-delay:.52s}

  /* ---- the panel it opens into ---- */
  #side{position:fixed;left:0;top:0;bottom:0;width:322px;z-index:19500;overflow-y:auto;
        padding:24px 18px 26px;border-width:0 1px 0 0;border-radius:0;
        display:flex;flex-direction:column;
        transform:translateX(-100%);transition:transform .7s cubic-bezier(.22,.75,.28,1)}
  #controls{flex:1;min-height:0}
  #side.in{transform:none}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  #head{margin-bottom:22px}
  #readout{margin-bottom:12px;padding-bottom:13px;border-bottom:1px solid var(--edge);
           font-size:11px;color:var(--soft);line-height:1.55;min-height:30px}
  #readout b{color:var(--fg);font-weight:500}
</style>
</head>
<body class="cover">

<canvas id="floor"></canvas>
<div id="world"></div>
<canvas id="wire"></canvas>

<aside id="side" class="panel chrome">
  <div id="head" class="mark"><b>Loom</b></div>
  <div id="controls"></div>
</aside>

<div id="cover"><div class="in chrome">
  <h1>Loom</h1>
  <p class="sub">150 grids, tied together by what they share.</p>
  <div id="cols"></div>
  <div class="steps">
    <div><b>1</b><span>Click any image to <em>gather what it is tied to</em></span></div>
    <div><b>2</b><span>Click it again to <em>turn it over</em> and read its numbers</span></div>
    <div><b>3</b><span>Pick a colour below to <em>pull its threads forward</em></span></div>
  </div>
  <button class="btn" id="go">Explore</button>
</div></div>

<div id="veil"></div>

<script src="../assets/loom.js"></script>
<script src="loom-core.js"></script>
<script src="loom-panel.js"></script>
<script>
/* ------------------------------------------------------------------
   Draft 1 — the cover.
   The name sits over the working thing, which is already moving: the
   field shuffles through all five views on its own, the sphere turns,
   the strip runs, and the nine colours underneath take it in turns to
   come forward. Touch one and it stays.
------------------------------------------------------------------ */
const SIDE = 322;

const loom = Loom.mount({
  world: document.getElementById('world'),
  wire:  document.getElementById('wire'),
  floor: document.getElementById('floor'),
  view: 'sphere', sort: 'colour', motion: .4, locked: true,
  onView: v => { panel.onView(v); say(''); },
  onSort: s => panel.onSort(s),
  onColumn: k => say(k ? 'Column <b>' + k + '</b>' : ''),
  onHold: (i, ln, open) => say('<b>' + DATA[i].title.replace(/-/g, ' ') + '</b> — ' +
                         ln.length + (open ? ' threads out. Click it again to let go.'
                                           : ' threads out. Click it again to read it.')),
  onRelease: () => say('')
});

const panel = Panel.build(document.getElementById('controls'), loom);
const read = document.createElement('div');
read.id = 'readout';
panel.foot.insertBefore(read, panel.foot.firstChild);
/* every view is bigger than the window on purpose, so each one says how to
   move around its own shape */
const base = () => loom.view === 'timeline'
  ? 'Drag sideways to run the strip — it loops for ever. Click a picture to gather its threads.'
  : loom.view === 'sphere'
  ? 'Drag to turn it. Click a picture to gather its threads, again to read it.'
  : 'Drag to move around it. Click a picture to gather its threads, again to read it.';
const say = h => read.innerHTML = h || base();
say('');

/* ---------- the cover's nine columns ---------- */
const cols = document.getElementById('cols');
cols.innerHTML = META.meanings.map(m =>
  '<button data-m="' + m + '"><b style="background:' + META.mcol[m] + '"></b>' +
  '<span>' + m + '</span></button>').join('');

let idle = null, step = 0, hovering = false;
const lift = m => {
  loom.setLit(m);
  cols.classList.toggle('dimmed', !!m);
  cols.querySelectorAll('button').forEach(b => b.classList.toggle('lit', b.dataset.m === m));
};
cols.querySelectorAll('button').forEach(b => {
  b.onmouseenter = () => { hovering = true; lift(b.dataset.m); };
  b.onmouseleave = () => { hovering = false; lift(null); };
  b.onclick = e => { e.stopPropagation(); enter(b.dataset.m); };
});

/* left alone it walks the five views and the nine meanings by itself —
   the whole tool demonstrating itself behind its own name */
function startIdle(){
  if (idle) return;
  idle = setInterval(() => {
    if (inside) return;
    step++;
    loom.goTo(Loom.VIEW_ORDER[step % Loom.VIEW_ORDER.length]);
    if (!hovering) lift(META.meanings[step % META.meanings.length]);
  }, 5400);
}
function stopIdle(){ clearInterval(idle); idle = null; lift(null); }

/* ---------- the way in ---------- */
const cover = document.getElementById('cover'), side = document.getElementById('side');
let inside = false;

function enter(pickMeaning){
  if (inside) return;
  inside = true;
  stopIdle();
  loom.setLocked(false);
  document.body.classList.remove('cover');
  cover.classList.add('gone');
  setTimeout(() => cover.style.display = 'none', 800);
  side.classList.add('in');
  slide(0, SIDE, 700);
  if (pickMeaning) setTimeout(() => loom.setOnly(pickMeaning), 140);
}
/* the field re-frames into whatever room is left */
function slide(from, to, T){
  const t0 = performance.now();
  (function walk(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    loom.setInset({ left: from + (to - from) * e });
    if (u < 1) requestAnimationFrame(walk);
  })(t0);
}
document.getElementById('go').onclick = e => { e.stopPropagation(); enter(); };
addEventListener('keydown', e => {
  if (!inside){ enter(); return; }
  if (e.key === 'Escape') loom.release();
});

/* ---------- open ---------- */
loom.ready(() => {
  document.getElementById('veil').classList.add('gone');
  /* a forced reflow, not requestAnimationFrame: rAF is suspended while the tab
     is hidden, so a class flip scheduled inside one never lands and the cover
     would sit invisible until the tab came forward */
  void cover.offsetHeight;
  cover.classList.add('up');
  startIdle();
});
</script>
</body>
</html>
