<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Design Space</title>
<style>
  :root{
    --bg:#efece4; --panel:#e5e1d6; --fg:#15150f; --dim:#84806f;
    --line:#c9c4b4; --hot:#d9330a; --gap:#b3241f; --ok:#1d7a4c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:11px;letter-spacing:.04em;overflow:hidden}

  #bar{position:fixed;top:0;left:0;right:0;height:56px;z-index:40;
    border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:22px;padding:0 18px}
  .brand{font-size:10px;letter-spacing:.19em;line-height:1.55}
  .brand i{font-style:normal;color:var(--dim);display:block;font-size:8px}
  .sel{display:flex;align-items:center;gap:6px}
  .sel label{font-size:8px;color:var(--dim);letter-spacing:.15em}
  select{font:inherit;font-size:10px;letter-spacing:.09em;background:var(--bg);color:var(--fg);
    border:1px solid var(--line);padding:4px 7px;cursor:pointer;text-transform:uppercase}
  select:hover{border-color:var(--fg)}
  .btn{border:1px solid var(--line);background:var(--bg);color:var(--dim);padding:5px 9px;
    cursor:pointer;font:inherit;font-size:9px;letter-spacing:.11em}
  .btn:hover{border-color:var(--fg);color:var(--fg)}
  .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .chips{display:flex;gap:1px;margin-left:auto}

  #plot{position:fixed;top:56px;left:0;right:290px;bottom:0;overflow:hidden}
  #grid{position:absolute;inset:0}
  .cell{position:absolute;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell.empty{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
    rgba(179,36,31,.075) 5px,rgba(179,36,31,.075) 6px)}
  .cell.empty.flag{outline:1px dashed var(--gap);outline-offset:-2px}
  .cell .n{position:absolute;right:3px;bottom:2px;font-size:8px;color:var(--dim)}
  .cell.hi{background:rgba(217,51,10,.08)}
  .tile{position:absolute;overflow:hidden;cursor:pointer;
    transition:transform .45s cubic-bezier(.22,.9,.24,1),opacity .3s,box-shadow .18s}
  .tile img{display:block;width:100%;height:100%;object-fit:cover;background:#d5d1c6}
  .tile.hot{z-index:600;transform:scale(3.4);box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .tile.mute{opacity:.12}
  .blob{position:absolute;pointer-events:none;transition:.45s}
  .bn{position:absolute;font-size:9px;color:var(--fg);pointer-events:none}
  .xl,.yl{position:absolute;font-size:9px;letter-spacing:.11em;color:var(--dim);
    text-transform:uppercase;pointer-events:none;overflow:hidden;white-space:nowrap}
  .xl{bottom:5px;text-align:center}
  .axn{position:absolute;font-size:9px;letter-spacing:.19em;color:var(--fg)}
  #axX{bottom:5px;right:12px}#axY{top:10px;left:8px}

  #side{position:fixed;top:56px;right:0;bottom:0;width:290px;z-index:30;
    border-left:1px solid var(--line);background:var(--panel);padding:15px;
    display:flex;flex-direction:column}
  #prev{width:100%;aspect-ratio:16/10;background:#d8d4c8;border:1px solid var(--line);
    margin-bottom:11px;overflow:hidden}
  #prev img{width:100%;height:100%;object-fit:cover;display:block}
  #meta{font-size:9px;line-height:1.8;color:var(--dim);overflow:auto;flex:1}
  #meta .t{color:var(--fg);font-size:10px;letter-spacing:.08em;display:block;margin-bottom:8px;line-height:1.5}
  #meta .row{display:flex;justify-content:space-between;gap:8px;
    border-bottom:1px solid rgba(0,0,0,.055);padding:2px 0}
  #meta .row b{color:var(--fg);font-weight:400}
  #meta .sw{display:inline-block;width:9px;height:9px;vertical-align:-1px;margin-left:4px;
    border:1px solid rgba(0,0,0,.25)}
  #verdict{border-top:2px solid var(--fg);margin-top:11px;padding-top:11px;font-size:9px;line-height:1.75}
  #verdict .v{font-size:23px;letter-spacing:.04em;display:block;margin:3px 0 5px}
  #verdict .lead{color:var(--fg);letter-spacing:.13em;font-size:8px}
  #verdict p{margin:7px 0 0;color:var(--dim);line-height:1.85}
  .good{color:var(--ok)}.bad{color:var(--gap)}
</style>
</head>
<body>

<div id="bar">
  <div class="brand">256 / DRAFT 02<i>DESIGN SPACE — WHICH TWO FIELDS ACTUALLY MAKE A PLANE?</i></div>
  <div class="sel"><label>Y</label><select id="yS"></select></div>
  <button class="btn" id="swap">⇄</button>
  <div class="sel"><label>X</label><select id="xS"></select></div>
  <div class="chips">
    <button class="btn" id="bDen">DENSITY</button>
    <button class="btn on" id="bGap">FLAG GAPS</button>
    <button class="btn" id="bWorld">REAL-WORLD ONLY</button>
    <button class="btn" id="bAnim">ANIMATED ONLY</button>
  </div>
</div>

<div id="plot"><div id="grid"></div>
  <div class="axn" id="axX"></div><div class="axn" id="axY"></div></div>

<div id="side">
  <div id="prev"></div>
  <div id="meta"></div>
  <div id="verdict"></div>
</div>

<script src="../assets/data.js"></script>
<script>
/* ------------------------------------------------------------------
   Any two fields make a plane — but most pairs are a lie, because the
   fields are not independent. Cramér's V measures that association,
   so the choice of axes stops being taste and becomes a measurement.
------------------------------------------------------------------ */

const HUE=h=>h<20||h>=330?'red':h<45?'orange':h<70?'yellow':h<160?'green':
             h<200?'cyan':h<255?'blue':h<330?'purple':'red';
const AXES={
  spectrum:{label:'Band (order→chaos)', vals:META.bands, of:d=>d.spectrum},
  meaning :{label:'Meaning',            vals:META.meanings, of:d=>d.meaning},
  category:{label:'Subject',            vals:META.categories, of:d=>d.category},
  decile  :{label:'Rank decile',        vals:[...Array(10)].map((_,i)=>`${i*10}–${i*10+10}%`),
            of:d=>{const t=(d.rank-RMIN)/(RMAX-RMIN);return `${Math.min(9,Math.floor(t*10))*10}–${Math.min(9,Math.floor(t*10))*10+10}%`}},
  hue     :{label:'Hue family',         vals:['red','orange','yellow','green','cyan','blue','purple'], of:d=>HUE(d.h)},
  light   :{label:'Lightness',          vals:['very dark','dark','mid','light'],
            of:d=>d.l<22?'very dark':d.l<42?'dark':d.l<64?'mid':'light'},
  sat     :{label:'Saturation',         vals:['grey','muted','saturated'],
            of:d=>d.s<14?'grey':d.s<42?'muted':'saturated'},
  world   :{label:'Register',           vals:['real-world','graphic'], of:d=>d.world?'real-world':'graphic'},
  motion  :{label:'Motion',             vals:['still','animated'], of:d=>d.animated?'animated':'still'},
};
const RANKS=DATA.map(d=>d.rank), RMIN=Math.min(...RANKS), RMAX=Math.max(...RANKS);
const BANDC={order:'#2f6fb0',inhabited:'#c39320',pressure:'#c0341a'};

let xK='world', yK='spectrum', density=false, gaps=true, onlyWorld=false, onlyAnim=false;
const grid=document.getElementById('grid');

const opt=k=>Object.keys(AXES).map(f=>
  `<option value="${f}" ${f===k?'selected':''}>${AXES[f].label}</option>`).join('');
xS.innerHTML=opt(xK); yS.innerHTML=opt(yK);
xS.onchange=e=>{xK=e.target.value;render()};
yS.onchange=e=>{yK=e.target.value;render()};
swap.onclick=()=>{[xK,yK]=[yK,xK];xS.value=xK;yS.value=yK;render()};
const t=(el,fn)=>{el.onclick=()=>{el.classList.toggle('on');fn(el.classList.contains('on'));render()}};
t(bDen,v=>density=v); t(bGap,v=>gaps=v); t(bWorld,v=>onlyWorld=v); t(bAnim,v=>onlyAnim=v);

const active=()=>DATA.filter(d=>(!onlyWorld||d.world)&&(!onlyAnim||d.animated));

/* Cramér's V — 0 independent, 1 fully redundant */
function cramersV(rows,xa,ya){
  const xs=xa.vals, ys=ya.vals, n=rows.length;
  if(!n) return 0;
  const obs={}, rx={}, ry={};
  rows.forEach(d=>{
    const a=xa.of(d), b=ya.of(d);
    obs[a+'|'+b]=(obs[a+'|'+b]||0)+1; rx[a]=(rx[a]||0)+1; ry[b]=(ry[b]||0)+1;
  });
  let chi=0;
  xs.forEach(a=>ys.forEach(b=>{
    const e=((rx[a]||0)*(ry[b]||0))/n;
    if(e>0){const o=obs[a+'|'+b]||0; chi+=(o-e)*(o-e)/e;}
  }));
  const k=Math.min(xs.length,ys.length)-1;
  return k>0?Math.min(1,Math.sqrt((chi/n)/k)):0;
}

function render(){
  const W=grid.clientWidth,H=grid.clientHeight,P={l:104,r:14,t:14,b:34};
  const xa=AXES[xK], ya=AXES[yK], xs=xa.vals, ys=ya.vals;
  const cw=(W-P.l-P.r)/xs.length, ch=(H-P.t-P.b)/ys.length;
  const rows=active();
  let html='', filled=0;

  ys.forEach((yv,r)=>xs.forEach((xv,c)=>{
    const its=rows.filter(d=>xa.of(d)===xv&&ya.of(d)===yv);
    if(its.length) filled++;
    html+=`<div class="cell ${its.length?'':'empty'} ${(!its.length&&gaps)?'flag':''}"
      style="left:${P.l+c*cw}px;top:${P.t+r*ch}px;width:${cw}px;height:${ch}px"
      data-x="${xv}" data-y="${yv}">${its.length?`<span class="n">${its.length}</span>`:''}</div>`;
  }));
  xs.forEach((xv,c)=>html+=`<div class="xl" style="left:${P.l+c*cw}px;width:${cw}px">${xv}</div>`);
  ys.forEach((yv,r)=>html+=`<div class="yl" style="left:6px;top:${P.t+r*ch+ch/2-5}px;width:94px">${yv}</div>`);

  ys.forEach((yv,r)=>xs.forEach((xv,c)=>{
    const its=rows.filter(d=>xa.of(d)===xv&&ya.of(d)===yv);
    if(!its.length) return;
    const x0=P.l+c*cw, y0=P.t+r*ch;
    if(density){
      const a=Math.min(1,its.length/26), sz=Math.min(cw,ch)*0.78*Math.sqrt(a);
      html+=`<div class="blob" style="left:${x0+cw/2-sz/2}px;top:${y0+ch/2-sz/2}px;
        width:${sz}px;height:${sz}px;background:${BANDC[yv]||BANDC[xv]||'#15150f'};
        opacity:${0.28+a*0.62}"></div>
        <div class="bn" style="left:${x0+cw/2-7}px;top:${y0+ch/2+sz/2+2}px">${its.length}</div>`;
      return;
    }
    const cols=Math.ceil(Math.sqrt(its.length*1.6)), pad=3;
    const tw=(cw-pad*2)/cols, th=Math.min((ch-pad*2)/Math.ceil(its.length/cols), tw*0.7);
    its.forEach((d,i)=>{
      html+=`<div class="tile" data-id="${d.id}" style="left:${x0+pad+(i%cols)*tw}px;
        top:${y0+pad+Math.floor(i/cols)*th}px;width:${tw-1}px;height:${th-1}px">
        <img src="${THUMB(d.thumb)}" loading="lazy" alt=""></div>`;
    });
  }));

  grid.innerHTML=html;
  axX.textContent='X → '+xa.label.toUpperCase();
  axY.textContent='Y ↓ '+ya.label.toUpperCase();

  const total=xs.length*ys.length, V=cramersV(rows,xa,ya);
  const verdict = V<0.20 ? ['good','INDEPENDENT','These two fields barely predict each other, so a two-dimensional plot is honest here — every cell is a genuinely different combination.']
    : V<0.40 ? ['','LOOSELY LINKED','There is a real association. The plane still works, but expect a lean rather than an even scatter.']
    : ['bad','REDUNDANT','One field is largely a re-description of the other. Plotting them as two axes invents a dimension the data does not have — use a single ordered layout instead.'];
  document.getElementById('verdict').innerHTML=
    `<span class="lead">ASSOCIATION — CRAMÉR’S V</span>
     <span class="v ${verdict[0]}">${V.toFixed(2)} <b style="font-size:10px;letter-spacing:.12em">${verdict[1]}</b></span>
     <p>${verdict[2]}</p>
     <p><b style="color:var(--fg)">${filled}</b>/${total} cells filled ·
        <span class="bad">${total-filled} empty</span> · ${rows.length} items shown</p>`;

  grid.querySelectorAll('.tile').forEach(el=>{
    const d=DATA.find(o=>o.id===el.dataset.id);
    el.onmouseenter=()=>{el.classList.add('hot');show(d)};
    el.onmouseleave=()=>el.classList.remove('hot');
    el.onclick=()=>window.open(d.live,'_blank');
  });
  grid.querySelectorAll('.cell').forEach(c=>{
    c.onmouseenter=()=>{c.classList.add('hi');
      if(!rows.some(d=>xa.of(d)===c.dataset.x&&ya.of(d)===c.dataset.y)) gap(c.dataset.x,c.dataset.y)};
    c.onmouseleave=()=>c.classList.remove('hi');
  });
}

function show(d){
  document.getElementById('prev').innerHTML=`<img src="${THUMB(d.thumb)}" alt="">`;
  const sw=c=>`<span class="sw" style="background:${c}"></span>`;
  document.getElementById('meta').innerHTML=
    `<span class="t">${d.title}</span>
     <div class="row"><span>rank</span><b>${d.rank} / ${RMAX}</b></div>
     <div class="row"><span>band</span><b>${META.bandLabels[d.spectrum]}</b></div>
     <div class="row"><span>meaning</span><b>${d.meaning}</b></div>
     <div class="row"><span>subject</span><b>${d.category}</b></div>
     <div class="row"><span>register</span><b>${d.world?'real-world':'graphic'}</b></div>
     <div class="row"><span>colour</span><b>${d.hex}${sw(d.hex)}</b></div>
     <div class="row"><span>hue / light</span><b>${HUE(d.h)} · ${Math.round(d.l)}%</b></div>
     ${d.animated?`<div class="row"><span></span><b style="color:var(--hot)">ANIMATED</b></div>`:''}
     ${d.aka.length?`<div style="margin-top:8px;font-style:italic;opacity:.7">“${d.aka[0]}”</div>`:''}`;
}
function gap(x,y){
  document.getElementById('prev').innerHTML='';
  document.getElementById('meta').innerHTML=
    `<span class="t" style="color:var(--gap)">EMPTY CELL</span>
     <div class="row"><span>${AXES[xK].label}</span><b>${x}</b></div>
     <div class="row"><span>${AXES[yK].label}</span><b>${y}</b></div>
     <p style="margin-top:11px;line-height:1.85">No item in the archive combines these.
     Either the combination does not occur in the world, or the collection has not
     looked for it. Empty cells are the shortlist for what to shoot next.</p>`;
}
addEventListener('resize',render);
render();
</script>
</body>
</html>
