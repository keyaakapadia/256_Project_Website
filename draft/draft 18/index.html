<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kin — circle</title>
<style>
  :root{
    --bg:#1b1b1b; --fg:#f5f4f1; --soft:#8d8a85; --gold:#ffc23d;
    --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
       overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab}
  body.drag{cursor:grabbing}
  body.overline{cursor:pointer}

  #wire{position:fixed;inset:0;pointer-events:none;z-index:5}
  #world{position:fixed;inset:0}
  .node{position:absolute;will-change:transform}
  .node{perspective:1600px}
  .card{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;
        transition:transform .62s cubic-bezier(.22,.75,.28,1)}
  .node.flip .card{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{transform:rotateY(180deg);background:#efece2;color:#17150f;
        padding:24px 26px;display:flex;flex-direction:column;justify-content:center;
        cursor:pointer}
  .back .t{font-size:17px;font-weight:500;line-height:1.26;margin-bottom:16px;
           letter-spacing:-.012em}
  .back .r{display:flex;gap:14px;font-size:13px;padding:4px 0}
  .back .r span{color:#8b8779;width:78px;flex:none}
  .back .r b{font-weight:400;flex:1}
  .back .k{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.16);
           font-size:12px;line-height:1.7;color:#8b8779}
  .node img{display:block;width:100%;height:100%;object-fit:cover;background:#262626;
            pointer-events:auto;cursor:pointer}
  .node .wash{position:absolute;inset:0;mix-blend-mode:screen;opacity:.20;
              pointer-events:none;transition:opacity .25s}
  .node.held .wash{opacity:0}
  .node.front{z-index:9000!important}
  .node.held{filter:drop-shadow(0 26px 70px rgba(0,0,0,.75))}
  .node.held .front{background:#efece2;padding:13px}

  .place{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
         color:var(--soft);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  .place.arc{letter-spacing:.24em;font-weight:500}

  #rail{position:fixed;left:30px;bottom:30px;z-index:40}
  .box{background:rgba(24,24,24,.80);backdrop-filter:blur(14px);padding:14px 18px 13px;
       border-radius:2px;border-left:2px solid rgba(255,255,255,.16)}
  #klist{display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));gap:0 20px}
  .col{display:flex;flex-direction:column}
  .box h4{margin:0;font-size:10px;letter-spacing:.19em;text-transform:uppercase;
          color:var(--soft);font-weight:400;cursor:pointer;user-select:none;
          display:flex;justify-content:space-between;gap:22px;align-items:center}
  .box h4:hover{color:var(--fg)}
  .box h4 b{font-weight:400;font-size:13px;line-height:1}
  #keybody{margin-top:11px;overflow:hidden;transition:.28s ease}
  #key.shut #keybody{margin-top:0;height:0;opacity:0}
  nav{position:fixed;right:30px;top:28px;z-index:40;display:flex;gap:6px;
      background:rgba(24,24,24,.80);backdrop-filter:blur(14px);padding:6px;border-radius:2px}
  nav button{background:none;border:0;width:38px;height:38px;cursor:pointer;padding:0;
             color:var(--soft);display:grid;place-items:center;border-radius:2px;
             transition:.15s;position:relative}
  nav button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  nav button.on{color:#141414;background:var(--fg)}
  nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;
          stroke-linecap:round;stroke-linejoin:round}
  nav button i{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);
    font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--soft);opacity:0;transition:.15s;white-space:nowrap;pointer-events:none}
  nav button:hover i{opacity:1}


  .m{display:flex;align-items:center;gap:10px;padding:3px 0;cursor:pointer;user-select:none;
     color:var(--soft);font-size:13px}
  .m i{width:9px;height:9px;border-radius:50%;flex:none;opacity:.6}
  .m u{text-decoration:none;flex:1}
  .m s{text-decoration:none;font-size:11px;opacity:.5;font-variant-numeric:tabular-nums}
  .m:hover,.m.on{color:var(--fg)} .m.on i,.m:hover i{opacity:1}
  .m.dim{opacity:.28}
  .fam{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#5f5c58;
       margin:0 0 6px}
  .m.all{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  .m.all i{display:none}

              font-size:11px;color:var(--soft);line-height:1.6}



  #boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;
        justify-content:center;transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .s{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="world"></div>
<canvas id="wire"></canvas>

<nav id="tabs"></nav>
<div id="rail"><div class="box" id="key">
  <h4 id="keyhead">What the grid does<b>–</b></h4>
  <div id="keybody"><div id="klist"></div>
  <div class="m all" data-m="">show everything</div></div></div></div>

<div id="boot"><div class="s" id="boots">0</div></div>

<script src="../assets/kin17.js?b=1"></script>
<script>
/* ------------------------------------------------------------------
   Where a picture sits is where the grid was found.
   A line means two pictures are doing the same thing, and its colour
   says which thing — cool where the grid holds tightest, warm where
   it loosens. Follow a line to travel to the other end.
------------------------------------------------------------------ */

const world = document.getElementById('world');
const cv = document.getElementById('wire'), ctx = cv.getContext('2d');
const TILE = META.tile, GOLD = META.gold;

let view = 'map';
let focal = 1400, dist = META.views.map.dist;
let camX = 0, camY = 0;
let drag = false, lx = 0, ly = 0, moved = false;
let hot = -1, pinned = -1, hotLine = -1;
let pos = DATA.map(d => d[view].slice());
let focusPos = null;          /* where everything goes while one picture is held */

function buildFocus(i){
  const ln = linksOf(i);
  const base = DATA.map(d => d[view].slice());
  const out = base.map(p => p.slice());
  out[i] = [0, 0, 0];
  const R0 = dist * 0.26, RING = dist * 0.115;   /* constant on screen, whatever the view */
  ln.forEach(([j], k) => {
    const ring = Math.floor(k / 12), inRing = k % 12, per = Math.min(12, ln.length - ring * 12);
    const a = (inRing / per) * Math.PI * 2 - Math.PI / 2 + ring * 0.26;
    const r = R0 + ring * RING;
    out[j] = [Math.cos(a) * r * 1.45, Math.sin(a) * r, 0];
  });
  const kin = new Set(ln.map(([j]) => j));
  base.forEach((p, j) => {                       /* everything else drifts to the rim */
    if (j === i || kin.has(j)) return;
    const d = Math.hypot(p[0], p[1]) || 1;
    out[j] = [p[0] / d * dist * 0.85, p[1] / d * dist * 0.85, p[2]];
  });
  return out;
}
function easeTo(target, T = 700){
  const from = pos.map(p => p.slice()), t0 = performance.now();
  cancelAnimationFrame(anim);
  (function step(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    pos = from.map((p, i) => [p[0] + (target[i][0] - p[0]) * e,
                              p[1] + (target[i][1] - p[1]) * e,
                              p[2] + (target[i][2] - p[2]) * e]);
    paint();
    if (u < 1) anim = requestAnimationFrame(step);
  })(t0);
  setTimeout(() => { pos = target.map(p => p.slice()); paint(); }, T + 60);
}
let P = [], segs = [];

let only = null;                       /* a meaning clicked in the key */
const ADJ = DATA.map(() => []);
META.edges.forEach(([a, b, ma, mb]) => {
  ADJ[a].push([b, ma, mb]); ADJ[b].push([a, mb, ma]);
});
const linksOf = i => ADJ[i].filter(([, ma, mb]) => !only || ma === only || mb === only);
const hasMeaning = (i, m) => DATA[i].means.includes(m);

/* ---------- pictures ---------- */
const nodes = DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML =
    `<div class="card">
       <div class="face front"><img src="${THUMB(d.thumb)}" alt="">
         <div class="wash" style="background:${META.mcol[d.means[0]]}"></div></div>
       <div class="face back"></div>
     </div>`;
  el.querySelector('.front').addEventListener('mouseenter', () => { hot = i; paint(); });
  el.querySelector('.front').addEventListener('mouseleave', () => { hot = -1; paint(); });
  el.querySelector('.front').addEventListener('click', e => {
    e.stopPropagation();
    if (moved) return;
    pinned = pinned === i ? -1 : i;
    if (pinned >= 0){ camX = camY = 0; focusPos = buildFocus(pinned); easeTo(focusPos); }
    else { focusPos = null; easeTo(DATA.map(d => d[view].slice())); }
    paint();
  });
  el.querySelector('.back').addEventListener('click', e => {
    e.stopPropagation();
    if (!moved){ pinned = -1; onUnpin(); paint(); }
  });
  el.__i = i;
  world.appendChild(el);
  return el;
});
function onUnpin(){}                       /* draft 17 replaces this */
addEventListener('click', () => {
  if (!moved && hotLine < 0 && pinned >= 0){
    pinned = -1; focusPos = null; easeTo(DATA.map(d => d[view].slice())); paint();
  }
});

/* each place is a horizontal band in Map view — label it at the left edge */
const minX = Math.min(...DATA.map(d => d.places[0]));
const places = META.places.map(p => {
  const ys = DATA.filter(d => d.place === p).map(d => d.places[1]);
  const el = document.createElement('div');
  el.className = 'place'; el.textContent = p;
  world.appendChild(el);
  return { p, el, at: [minX - 620, ys.reduce((a, b) => a + b, 0) / ys.length] };
});

/* in Grid view, name each meaning above its block */
const heads = META.meanings.map(m => {
  const el = document.createElement('div');
  el.className = 'place'; el.textContent = m;
  el.style.color = META.mcol[m];
  world.appendChild(el);
  return { m, el, x: META.gridHeads[m] };
});

/* in Circle view, the word for each sector, out past the rim and turned to the arc */
const rims = META.meanings.map(m => {
  const el = document.createElement('div');
  el.className = 'place arc'; el.textContent = m;
  el.style.color = META.mcol[m];
  world.appendChild(el);
  const [x, y, rot] = META.circleHeads[m];
  return { m, el, x, y, rot };
});

/* the horizontal axis, said once, out in the space */
const ends = [['seen every day', META.freqX[0]], ['seen rarely', META.freqX[1]]]
  .map(([t, x]) => {
    const el = document.createElement('div');
    el.className = 'place'; el.textContent = t;
    el.style.color = '#a5a29c';
    world.appendChild(el);
    return { el, x };
  });

function project(x, y, z){
  const d = z + dist;
  if (d < 90) return null;
  const s = focal / d;
  return { x: innerWidth / 2 + (x - camX) * s, y: innerHeight / 2 + (y - camY) * s, s, d };
}
const refScale = () => focal / dist;
const rgba = (hex, a) => { const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`; };
function stroke(pa, pb, ma, mb, alpha){
  const ca = META.mcol[ma], cb = META.mcol[mb];
  if (ca === cb) return rgba(ca, alpha);
  const g = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
  g.addColorStop(0, rgba(ca, alpha)); g.addColorStop(1, rgba(cb, alpha));
  return g;
}

const last = new Map();
function put(el, k, v){                    /* only touch the DOM when it changes */
  const key = el.__i + k;
  if (last.get(key) === v) return;
  last.set(key, v); el.style[k] = v;
}
function paint(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  P = pos.map(p => project(p[0], p[1], p[2]));
  const focusI = pinned >= 0 ? pinned : hot;
  const ln = focusI >= 0 ? linksOf(focusI) : [];
  const kin = new Set(ln.map(([j]) => j));
  const live = i => !only || hasMeaning(i, only);

  /* pictures */
  DATA.map((_, i) => i).filter(i => P[i]).sort((a, b) => P[b].d - P[a].d).forEach(i => {
    /* a picture in hand grows with how much it is tied to; a held one is matted */
    const p = P[i], el = nodes[i];
    const held = i === pinned;
    const big = i === focusI ? 1.25 + 0.75 * (DATA[i].deg / META.maxdeg) : 1;
    let w = TILE * p.s * big, h = w * .8;
    if (held){ h = Math.min(innerHeight * .30, 330); w = h / .8; }
    else if (pinned >= 0 && kin.has(i)){         /* ringed kin come forward too */
      const floor = Math.min(innerHeight * .15, 150);
      if (h < floor){ h = floor; w = h / .8; }
    }
    put(el, 'transform', `translate(${Math.round(p.x - w / 2)}px,${Math.round(p.y - h / 2)}px)`);
    put(el, 'width', Math.round(w) + 'px'); put(el, 'height', Math.round(h) + 'px');
    el.classList.toggle('held', held);
    const flip = held && hot === i;
    el.classList.toggle('flip', flip);
    if (flip) fillBack(el, i, ln);
    put(el, 'opacity', String(!live(i) ? .10
      : focusI < 0 ? 1 : (i === focusI ? 1 : kin.has(i) ? .95 : .24)));
    put(el, 'zIndex', String((pinned >= 0 && kin.has(i) ? 4000 : 0) + 1000 - Math.round(p.d / 4)));
    el.classList.toggle('front', i === focusI);
  });

  /* the resting web — quiet, but the field is never empty */
  ctx.lineWidth = 1.4;
  META.edges.forEach(([a, b, ma, mb]) => {
    if (only && ma !== only && mb !== only) return;
    const pa = P[a], pb = P[b];
    if (!pa || !pb) return;
    ctx.strokeStyle = stroke(pa, pb, ma, mb, focusI < 0 ? .34 : .07);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });

  /* every line the picture in hand actually has — one per shared meaning */
  segs = [];
  if (focusI >= 0 && live(focusI)){
    const p0 = P[focusI];
    ln.forEach(([j, ma, mb]) => {
      if (!P[j] || !live(j)) return;
      segs.push({ a: p0, b: P[j], j, ma, mb });
    });
    segs.forEach((sg, k) => {
      const on = k === hotLine;
      ctx.strokeStyle = on ? GOLD : stroke(sg.a, sg.b, sg.ma, sg.mb, .9);
      ctx.lineWidth = on ? 3.4 : 2;
      ctx.beginPath(); ctx.moveTo(sg.a.x, sg.a.y);
      if (pinned >= 0){                       /* fan them, so the bundle reads as a spray */
        const mx = (sg.a.x + sg.b.x) / 2, my = (sg.a.y + sg.b.y) / 2;
        const dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx, dy) || 1;
        const bow = Math.min(120, L * 0.17) * (k % 2 ? 1 : -1);
        ctx.quadraticCurveTo(mx - dy / L * bow, my + dx / L * bow, sg.b.x, sg.b.y);
      } else ctx.lineTo(sg.b.x, sg.b.y);
      ctx.stroke();
    });
    if (hotLine >= 0 && segs[hotLine]){
      const t = segs[hotLine].b;
      ctx.strokeStyle = GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(t.x - TILE * t.s / 2 - 4, t.y - TILE * t.s * .4 - 4,
                     TILE * t.s + 8, TILE * t.s * .8 + 8);
    }
  }

  places.forEach(o => {
    const p = project(o.at[0], o.at[1], 0);
    if (!p || view !== 'places') { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = focusI < 0 ? .85 : .3;
    o.el.style.fontSize = Math.max(9, Math.min(15, 11 * p.s * 1.4)) + 'px';
  });
  heads.forEach(o => {
    const q = project(o.x, META.gridTop, 0);
    if (!q || view !== 'grid') { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${q.x}px,${q.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = focusI < 0 ? .85 : .3;
    o.el.style.fontSize = Math.max(9, Math.min(15, 11 * q.s * 1.5)) + 'px';
  });
  rims.forEach(o => {
    const q = project(o.x, o.y, 0);
    if (!q || view !== 'circle') { o.el.style.opacity = 0; return; }
    o.el.style.transform =
      `translate(${q.x}px,${q.y}px) translate(-50%,-50%) rotate(${o.rot}deg)`;
    o.el.style.opacity = (only && only !== o.m) ? .18 : focusI < 0 ? .95 : .3;
    o.el.style.fontSize = Math.max(9, Math.min(17, 12 * q.s * 1.5)) + 'px';
  });
  ends.forEach(o => {
    const q = project(o.x, META.axisY, 0);
    if (!q || view !== 'places') { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${q.x}px,${q.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = focusI < 0 ? .8 : .25;
    o.el.style.fontSize = Math.max(10, Math.min(16, 12 * q.s * 1.4)) + 'px';
  });
}

function fillBack(el, i, ln){
  const d = DATA[i], by = {};
  ln.forEach(([, ma, mb]) => { by[mb] = (by[mb] || 0) + 1; });
  const seen = d.freq < .3 ? 'every day' : d.freq < .55 ? 'now and then' : 'rarely';
  el.querySelector('.back').innerHTML =
    `<div class="t">${d.title}</div>
     <div class="r"><span>Does</span><b>${d.means.map(m =>
        `<span style="color:${META.mcol[m]}">${m}</span>`).join(' + ')}</b></div>
     <div class="r"><span>Found in</span><b>${d.place}</b></div>
     <div class="r"><span>Seen</span><b>${seen}</b></div>
     <div class="r"><span>Joined to</span><b>${ln.length} pictures</b></div>
     <div class="k">${META.meanings.filter(m => by[m]).map(m =>
        `<span style="color:${META.mcol[m]}">${by[m]} ${m}</span>`).join(' · ')}</div>`;
}

/* ---------- following a line ---------- */
function nearestSeg(mx, my){
  let best = -1, bd = 9;
  segs.forEach((s, k) => {
    const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    const L = dx * dx + dy * dy; if (!L) return;
    let t = ((mx - s.a.x) * dx + (my - s.a.y) * dy) / L;
    t = Math.max(.14, Math.min(1, t));            /* ignore the stub under the picture */
    const bow = pinned >= 0 ? Math.min(120, Math.sqrt(L) * 0.17 * Math.sqrt(L)) * (k % 2 ? 1 : -1) : 0;
    const len = Math.sqrt(L) || 1;
    const px = s.a.x + dx * t - (dy / len) * bow * 2 * t * (1 - t);
    const py = s.a.y + dy * t + (dx / len) * bow * 2 * t * (1 - t);
    const d = Math.hypot(mx - px, my - py);
    if (d < bd) { bd = d; best = k; }
  });
  return best;
}
addEventListener('mousemove', e => {
  if (drag || segs.length === 0) return;
  const k = nearestSeg(e.clientX, e.clientY);
  if (k !== hotLine){ hotLine = k; document.body.classList.toggle('overline', k >= 0); paint(); }
});
addEventListener('click', e => {
  if (moved || hotLine < 0 || !segs[hotLine]) return;
  const j = segs[hotLine].j;
  hotLine = -1; document.body.classList.remove('overline');
  pinned = j; camX = camY = 0; focusPos = buildFocus(j); easeTo(focusPos); paint();
});
function flyTo(j){
  pinned = j;                                   /* select first — the camera only catches up */
  const t = pos[j], fx = camX, fy = camY, t0 = performance.now(), T = 620;
  paint();
  (function step(now){
    const u = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - u, 3);
    camX = fx + (t[0] - fx) * e; camY = fy + (t[1] - fy) * e;
    paint();
    if (u < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---------- views ---------- */
let anim = null;
function goto(v){
  view = v; dist = META.views[v].dist; camX = 0; camY = 0;
  pinned = -1; focusPos = null;
  const from = pos.map(p => p.slice()), to = DATA.map(d => d[v]);
  const t0 = performance.now(), T = 950;
  cancelAnimationFrame(anim);
  (function step(now){
    const u = Math.min(1, (now - t0) / T);
    const e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    pos = from.map((p, i) => [p[0] + (to[i][0] - p[0]) * e, p[1] + (to[i][1] - p[1]) * e,
                              p[2] + (to[i][2] - p[2]) * e]);
    paint();
    if (u < 1) anim = requestAnimationFrame(step);
  })(t0);
  setTimeout(() => { pos = DATA.map(d => d[v].slice()); paint(); }, T + 60);
}
const ICON = {
  map:    '<circle cx="5" cy="6" r="1.6"/><circle cx="13" cy="4" r="1.6"/><circle cx="9" cy="11" r="1.6"/><circle cx="16" cy="13" r="1.6"/><circle cx="4" cy="15" r="1.6"/>',
  places: '<path d="M10 17s6-5.1 6-9.4A6 6 0 0 0 4 7.6C4 11.9 10 17 10 17z"/><circle cx="10" cy="7.4" r="2.1"/>',
  web:    '<circle cx="10" cy="10" r="2"/><circle cx="4" cy="4.5" r="1.5"/><circle cx="16" cy="5" r="1.5"/><circle cx="4.5" cy="16" r="1.5"/><circle cx="16" cy="15.5" r="1.5"/><path d="M8.6 8.6 5.1 5.6M11.5 8.7 14.7 6M8.7 11.5 5.7 14.7M11.5 11.4 14.7 14.3"/>',
  grid:   '<rect x="3" y="3" width="5.5" height="5.5"/><rect x="11.5" y="3" width="5.5" height="5.5"/><rect x="3" y="11.5" width="5.5" height="5.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5"/>',
  circle: '<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.6"/>'
};
document.getElementById('tabs').innerHTML = META.viewOrder.map(v =>
  `<button data-v="${v}" class="${v === view ? 'on' : ''}" title="${META.views[v].label}">
     <svg viewBox="0 0 20 20">${ICON[v]}</svg><i>${META.views[v].label}</i></button>`).join('');
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(o => o.classList.toggle('on', o === b));
  goto(b.dataset.v);
});

const SHORT = { inform: 'locating', hold: 'dividing', make: 'filling' };
document.getElementById('klist').innerHTML = META.families.map(f =>
  `<div class="col"><div class="fam">${SHORT[f]}</div>` +
  META.meanings.filter(m => META.fam[m] === f).map(m =>
    `<div class="m" data-m="${m}"><i style="background:${META.mcol[m]}"></i>
       <u>${m}</u><s>${DATA.filter(d => d.means.includes(m)).length}</s></div>`).join('')
  + `</div>`).join('');
document.getElementById('keyhead').onclick = () => {
  const k = document.getElementById('key');
  k.classList.toggle('shut');
  k.querySelector('h4 b').textContent = k.classList.contains('shut') ? '+' : '–';
};
document.querySelectorAll('.m').forEach(el => el.onclick = () => {
  const m = el.dataset.m || null;
  only = (only === m) ? null : m;
  document.querySelectorAll('.m').forEach(o =>
    o.classList.toggle('dim', !!only && o.dataset.m !== only && o.dataset.m !== ''));
  paint();
});

addEventListener('mousedown', e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('drag'); });
addEventListener('mouseup', () => { drag = false; document.body.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) moved = true;
  const s = refScale();
  camX -= (e.clientX - lx) / s; camY -= (e.clientY - ly) / s;
  lx = e.clientX; ly = e.clientY; paint();
});
addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(700, Math.min(12000, dist * (e.deltaY > 0 ? 1.075 : .93)));
  paint();
}, { passive: false });
addEventListener('resize', paint);

let loaded = 0;
world.querySelectorAll('img').forEach(img => {
  const tick = () => {
    document.getElementById('boots').textContent = `${++loaded} / ${DATA.length}`;
    if (loaded >= DATA.length) { paint();
      setTimeout(() => document.getElementById('boot').classList.add('gone'), 240); }
  };
  img.complete ? tick() : (img.onload = tick, img.onerror = tick);
});
paint();
</script>
</body>
</html>
