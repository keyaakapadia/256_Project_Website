<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Eight Layouts, Eight Reasons</title>
<style>
  :root{
    --bg:#0a0a0c; --fg:#f0efec; --dim:#6a6a74; --line:#202026; --hot:#ff4d2e;
    --order:#4da3ff; --inhab:#ffc84d; --press:#ff4d2e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:11px;letter-spacing:.05em;overflow:hidden}

  #stage{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 44%}
  #world{position:absolute;inset:0;transform-style:preserve-3d}

  .it{position:absolute;left:50%;top:44%;transform-style:preserve-3d;cursor:pointer;
    transition:transform 1.1s cubic-bezier(.22,.9,.24,1),width .9s,height .9s,opacity .45s}
  .it img{display:block;width:100%;height:100%;object-fit:cover;background:#2a2a30;
    border:1px solid rgba(255,255,255,.12)}
  .it.mute{opacity:.10}
  .it.hot{z-index:9999!important}
  .it.hot img{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 44px rgba(255,77,46,.45)}
  .it .bar{position:absolute;left:0;right:0;bottom:-3px;height:2px;opacity:.9}

  #struct{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
  #struct.on{opacity:1}
  #struct line,#struct ellipse,#struct circle,#struct rect{
    stroke:rgba(255,255,255,.16);fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
  #struct text{fill:rgba(255,255,255,.4);font:8px var(--mono);letter-spacing:.14em}
  #struct .em{stroke:rgba(255,255,255,.34)}

  .rail{position:fixed;z-index:9000}
  #left{left:20px;top:18px;width:206px}
  .brand{font-size:10px;letter-spacing:.2em}
  .brand i{font-style:normal;color:var(--dim);display:block;font-size:8px;margin-top:3px;line-height:1.6}
  .lays{margin-top:18px;border-top:1px solid var(--line)}
  .lay{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);
    color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
  .lay:hover{color:var(--fg);background:#121218}
  .lay.on{background:var(--fg);color:var(--bg)}
  .lay .k{width:8px;font-size:9px;opacity:.6}
  .lay .n{flex:1;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
  .lay .r{font-size:8px;opacity:.6}

  .grp{margin-top:16px}
  .grp h4{font-size:8px;letter-spacing:.18em;color:var(--dim);margin:0 0 7px;font-weight:400}
  .sw{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer;
    user-select:none;padding:2px 0}
  .sw:hover{color:var(--fg)}
  .sw .box{width:10px;height:10px;border:1px solid #30303a;flex:none}
  .sw.on .box{background:var(--hot);border-color:var(--hot)}
  .sw.on{color:var(--fg)}
  .sw span{font-size:9px;letter-spacing:.11em}

  #right{right:20px;top:18px;width:248px;text-align:right}
  #meta{color:var(--dim);font-size:9px;line-height:1.75;min-height:190px}
  #meta .t{color:var(--fg);font-size:10px;letter-spacing:.08em;display:block;margin-bottom:8px;line-height:1.5}
  #meta .row{display:flex;justify-content:flex-end;gap:9px}
  #meta .row i{font-style:normal;opacity:.45;min-width:70px}
  #meta b{color:var(--fg);font-weight:400}
  #meta .chip{display:inline-block;width:9px;height:9px;vertical-align:-1px;margin-left:4px}
  #meta .aka{margin-top:8px;opacity:.6;font-style:italic;line-height:1.7}

  /* the reason panel — the point of the piece */
  #why{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9000;
    width:min(760px,72vw);text-align:center;pointer-events:none;transition:opacity .45s}
  #why{background:radial-gradient(ellipse at center,rgba(10,10,12,.985) 0%,rgba(10,10,12,.95) 55%,rgba(10,10,12,0) 100%);padding:18px 34px 12px}
  #why .hd{font-size:10px;letter-spacing:.26em;color:var(--fg);margin-bottom:9px}
  #why .bd{font-size:10px;line-height:1.95;color:#b6b6c0;letter-spacing:.045em}
  #why .bd b{color:var(--fg);font-weight:400}
  #why .ref{margin-top:9px;font-size:8px;letter-spacing:.16em;color:var(--dim)}

  #legend{position:fixed;left:20px;bottom:22px;z-index:9000;display:flex;flex-direction:column;gap:5px}
  .lg{display:flex;align-items:center;gap:7px;font-size:9px;color:var(--dim);letter-spacing:.1em}
  .lg .d{width:16px;height:3px}
  #tally{position:fixed;right:20px;bottom:22px;z-index:9000;font-size:9px;color:var(--dim);
    text-align:right;line-height:1.7}
  #tally b{color:var(--fg);font-weight:400}
</style>
</head>
<body>

<div id="stage"><div id="world"></div></div>
<svg id="struct"></svg>

<div class="rail" id="left">
  <div class="brand">256 / LAYOUT STUDY<i>256 of 313 — 16×16, every layout answers to a property of the data</i></div>
  <div class="lays" id="lays"></div>
  <div class="grp">
    <h4>COLOUR BY</h4>
    <div class="sw on" id="cb-band"><div class="box"></div><span>SPECTRUM BAND</span></div>
    <div class="sw" id="cb-mean"><div class="box"></div><span>MEANING</span></div>
    <div class="sw" id="cb-real"><div class="box"></div><span>ACTUAL COLOUR</span></div>
  </div>
  <div class="grp">
    <h4>OVERLAY</h4>
    <div class="sw on" id="sw-str"><div class="box"></div><span>SHOW STRUCTURE</span></div>
    <div class="sw" id="sw-spin"><div class="box"></div><span>AUTO ORBIT</span></div>
  </div>
</div>

<div class="rail" id="right"><div id="meta"></div></div>

<div id="why"><div class="hd"></div><div class="bd"></div><div class="ref"></div></div>

<div id="legend"></div>
<div id="tally"></div>

<script src="../assets/data.js"></script>
<script>
/* ------------------------------------------------------------------
   Eight layouts. Each one is chosen because a specific property of
   this dataset makes it the honest shape — the reason is on screen.
------------------------------------------------------------------ */

const LAYOUTS=[
 { key:'spine', name:'Spine', rule:'ordered by spectrum_rank',
   hd:'THE SPINE — ONE AXIS, BECAUSE ORDER→CHAOS IS ONE DIMENSION',
   bd:'The collection makes a single claim: these grids run from <b>order</b> to <b>chaos</b>. A claim with one variable has exactly one honest shape — a line. Vertical position here carries <b>no</b> meaning, deliberately, so that horizontal position reads as pure rank. Any second dimension would invent a relationship the tagging does not support.',
   ref:'AFTER — WW1 DATE LINE · ART-HISTORY TIMELINE POSTER' },

 { key:'bands', name:'Bands', rule:'three declared states',
   hd:'BANDS — THE COLLECTION’S OWN THREE-PART CLAIM',
   bd:'The archive does not actually think in 238 ranks; it thinks in three states — <b>order</b>, <b>inhabited</b>, <b>under pressure</b>. Splitting the spine into three rows tests whether those states look different. They were selected at 33 / 33 / 34, so any visual imbalance you see is in the images, not the sample.',
   ref:'AFTER — PHASE 01–07 MATERIAL MATRIX' },

 { key:'typology', name:'Typology', rule:'grouped by category',
   hd:'TYPOLOGY — EQUAL CELLS, BECAUSE CATEGORY IS THE INDEPENDENT AXIS',
   bd:'Category is the only field that does <b>not</b> track the order→chaos gradient: a street photograph can sit anywhere on it. That independence is what earns the equal cell. Identical framing is the Becher move — when every frame is the same, the only thing left to look at is the difference between subjects.',
   ref:'AFTER — PHASE MATRIX · TYPOLOGY GRIDS' },

 { key:'colour', name:'Colour field', rule:'hue × lightness',
   hd:'COLOUR FIELD — THE ONLY COMPLETE, CONTINUOUS FIELD IN THE SET',
   bd:'Every one of the 313 items has an extracted hex and palette — <b>100% coverage</b>, the only field that can say that. It is also continuous, so it needs no buckets and no editorial judgement. X is hue, Y is lightness. Nothing here was decided by hand, which is exactly the point: this is the archive sorting itself.',
   ref:'AFTER — PHOTO NODE-GRAPH · LA RAZA FLY-THROUGH' },

 { key:'lanes', name:'Meaning lanes', rule:'meaning × rank',
   hd:'MEANING LANES — PROOF THAT MEANING IS NOT AN INDEPENDENT AXIS',
   bd:'Nine lanes, one per meaning, X still the spectrum rank. The shape that appears is a <b>diagonal, not a scatter</b>: “play” takes 10 items at the ordered end and 72 at the chaotic end, while organize, contain and measure vanish. Meaning is a re-description of the same gradient. Plotting it as a second axis would fake a two-dimensional structure that is not there.',
   ref:'AFTER — “EVERY : SECOND” ISOMETRIC RIBBONS' },

 { key:'section', name:'Section', rule:'rank as elevation',
   hd:'SECTION — THE GRADIENT MADE WALKABLE',
   bd:'Same rank order as the spine, drawn as an architectural elevation: strips standing on and hanging from a ground line. It converts an abstract ranking into a <b>street you could walk</b>. Borrowed wholesale from Ruscha’s Sunset Strip and the Istanbul passage drawings — the axis is distance, not time.',
   ref:'AFTER — ISTANBUL PASSAGES SECTION · MUSEUM WAYFINDING' },

 { key:'orbit', name:'Orbit', rule:'rank on a closed loop',
   hd:'ORBIT — THE COUNTER-ARGUMENT TO THE SPINE',
   bd:'The same ranking bent into a ring. A loop has <b>no first item and no last</b>, so the ordering survives while the hierarchy does not — chaos sits next to order and the sequence reads as a cycle rather than a decline. Use it if the thesis is that grids do not degrade, they circulate.',
   ref:'AFTER — STUDIO ELLIPSE CAROUSEL · “SCROLL” ARC' },

 { key:'wall', name:'Wall', rule:'no gaps, one object',
   hd:'WALL — 16 × 16, THE REASON THE SET IS 256',
   bd:'Every image the same size, no gutters, no visible sorting. <b>256 = 16²</b>, so the archive lands as a perfect square with no ragged last row — the only count at which the collection and the grid agree exactly. The 57 items left outside are the ones missing a coordinate on at least one axis: <b>the grid can only hold what it can address.</b>',
   ref:'AFTER — OBSCURA TILE WALL · SUSPENDED-PRINT ROOMS' },
];

const BANDC={order:'#4da3ff',inhabited:'#ffc84d',pressure:'#ff4d2e'};
const MEANC={organize:'#4da3ff',contain:'#5fd0d0',separate:'#7fe08a',guide:'#b8e04d',
             measure:'#ffe14d',repeat:'#ffc84d',control:'#ff9a4d',play:'#ff4d2e',break:'#d94dff'};

const world=document.getElementById('world'), svg=document.getElementById('struct');
let cur='spine', colourBy='band', spin=false, yaw=0, pitch=0, drag=false, lx=0, ly=0;
const V=()=>({w:innerWidth,h:innerHeight});
const rnd=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};

const RANKS=DATA.map(d=>d.rank), RMIN=Math.min(...RANKS), RMAX=Math.max(...RANKS);
const nodes=DATA.map((d,i)=>{
  const el=document.createElement('div');
  el.className='it';
  el.innerHTML=`<img src="${THUMB(d.thumb)}" loading="lazy" alt=""><div class="bar"></div>`;
  el.onmouseenter=()=>{el.classList.add('hot');info(d)};
  el.onmouseleave=()=>{el.classList.remove('hot')};
  el.onclick=()=>window.open(d.live,'_blank');
  world.appendChild(el);
  return{d,el,i};
});

function colourOf(d){
  if(colourBy==='band') return BANDC[d.spectrum]||'#555';
  if(colourBy==='mean') return MEANC[d.meaning]||'#555';
  return d.hex;
}

const PADL=236, PADR=268;
function box(){const{w,h}=V();return{w,h,cw:w-PADL-PADR,ox:(PADL-PADR)/2};}

/* beeswarm: x is meaningful, y is only collision resolution */
function swarm(list,xOf,tw,th,maxY){
  const placed=[];
  return list.map(d=>{
    const x=xOf(d); let y=0;
    for(let k=0;k<600;k++){
      const cand=(k%2?1:-1)*Math.ceil(k/2)*(th*0.52);
      if(Math.abs(cand)>maxY) continue;
      if(!placed.some(p=>Math.abs(p.x-x)<tw*0.90 && Math.abs(p.y-cand)<th*0.90)){y=cand;break;}
    }
    placed.push({x,y}); return {id:d.id,x,y};
  });
}

let SWARM=null, SECT=null;

function layout(key){
  const{w,h,cw,ox}=box(), n=nodes.length;
  const CAT=META.categories, MEAN=META.meanings;
  const T=d=>(d.rank-RMIN)/(RMAX-RMIN);

  if(key==='spine'){
    const tw=42,th=29;
    SWARM=swarm(DATA,d=>ox-cw/2+T(d)*cw,tw,th,h*0.36);
  }
  if(key==='section'){
    const tw=22,th=52;
    SECT=swarm(DATA,d=>ox-cw/2+(DATA.indexOf(d)/(n-1))*cw,tw,th,h*0.26);
  }

  nodes.forEach(({d,el},i)=>{
    let x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,bw=92,bh=62;
    const t=T(d);

    switch(key){
      case 'spine':{
        const p=SWARM.find(o=>o.id===d.id);
        x=p.x; y=p.y; bw=42; bh=29;
        break;}

      case 'bands':{
        const b=META.bands.indexOf(d.spectrum);
        const inB=DATA.filter(o=>o.spectrum===d.spectrum);
        const k=inB.findIndex(o=>o.id===d.id);
        const cols=19, tw=cw/cols;
        x=ox-cw/2+(k%cols)*tw+tw/2;
        y=(b-1)*h*0.29+Math.floor(k/cols)*26-52;
        bw=Math.min(tw-4,50); bh=bw*0.66;
        break;}

      case 'typology':{
        const ci=CAT.indexOf(d.category);
        const inC=DATA.filter(o=>o.category===d.category);
        const k=inC.findIndex(o=>o.id===d.id);
        const colW=cw/CAT.length, cols=4;
        x=ox-cw/2+ci*colW+colW/2+((k%cols)-1.5)*(colW/4.3);
        y=-h*0.30+Math.floor(k/cols)*23;
        bw=Math.min(colW/4.4,34); bh=bw*0.68;
        break;}

      case 'colour':{
        const a=(d.h/360)*Math.PI*2-Math.PI/2;
        const rad=(0.20+(d.s/100)*0.80);
        x=ox+Math.cos(a)*rad*cw*0.46;
        y=-((d.l-50)/50)*h*0.34;
        z=(d.s-50)*3.4;
        bw=40; bh=27;
        break;}

      case 'lanes':{
        const mi=MEAN.indexOf(d.meaning);
        const sameLane=DATA.filter(o=>o.meaning===d.meaning);
        const k=sameLane.findIndex(o=>o.id===d.id);
        x=ox-cw/2+t*cw;
        y=-h*0.35+mi*(h*0.079)+((k%3)-1)*8;
        bw=26; bh=18;
        break;}

      case 'section':{
        const p=SECT.find(o=>o.id===d.id);
        x=p.x; y=p.y+(DATA.indexOf(d)%2?30:-30); bw=22; bh=52;
        break;}

      case 'orbit':{
        const a=t*Math.PI*2;
        const rr=Math.min(cw*0.34,420);
        x=ox+Math.cos(a)*rr*1.30;
        z=Math.sin(a)*rr;
        y=Math.sin(a*3)*28;
        ry=-a*180/Math.PI+90;
        bw=66; bh=44;
        break;}

      case 'wall':{
        const cols=META.side;                    /* exactly 16 */
        const cwid=Math.min(cw/cols,(h*0.70)/cols), ch=cwid;
        x=ox+(i%cols)*cwid-((cols-1)*cwid)/2;
        y=Math.floor(i/cols)*ch-(Math.ceil(n/cols)-1)*ch/2;
        bw=cwid; bh=ch; rx=4;
        break;}
    }

    el.style.width=bw+'px'; el.style.height=bh+'px';
    el.style.transform=`translate3d(${x-bw/2}px,${y-bh/2}px,${z}px)
      rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
    el.style.zIndex=Math.round(3000+z);
    el.querySelector('.bar').style.background=colourOf(d);
  });

  drawStruct(key);
}

function drawStruct(key){
  const{w,h,cw,ox}=box(), cx=w/2+ox, cy=h*0.44;
  const LX=cx-cw/2, RX=cx+cw/2;
  const L=(a,b,c,d,cl='')=>`<line class="${cl}" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  let s='';

  if(key==='spine'||key==='section'){
    s+=L(LX,cy,RX,cy,'em');
    [['ORDER',0],['INHABITED',.5],['UNDER PRESSURE',1]].forEach(([t,p])=>{
      const px=LX+p*cw;
      s+=L(px,cy-14,px,cy+14)+`<text x="${px-(p===1?70:p===0?0:34)}" y="${cy+30}">${t}</text>`;
    });
  }
  if(key==='bands'){
    META.bands.forEach((b,i)=>{
      const py=cy+(i-1)*h*0.27-70;
      s+=L(LX,py,RX,py)+`<text x="${LX}" y="${py-8}">${META.bandLabels[b].toUpperCase()}</text>`;
    });
  }
  if(key==='typology'){
    const colW=cw/META.categories.length;
    META.categories.forEach((c,i)=>{
      const px=LX+i*colW;
      s+=L(px,cy-h*0.30,px,cy+h*0.30);
      s+=`<text transform="translate(${px+11},${cy+h*0.29}) rotate(-90)">${c.toUpperCase()}</text>`;
    });
  }
  if(key==='colour'){
    [0.35,0.7,1].forEach(r=>s+=`<ellipse cx="${cx}" cy="${cy}" rx="${cw*0.46*r}" ry="${h*0.34*r}"/>`);
    s+=L(LX,cy,RX,cy)+`<text x="${LX}" y="${cy-9}">LIGHT ↑ / DARK ↓ · ANGLE = HUE</text>`;
  }
  if(key==='lanes'){
    META.meanings.forEach((m,i)=>{
      const py=cy-h*0.34+i*(h*0.078);
      s+=L(LX,py,RX,py);
      const n=DATA.filter(d=>d.meaning===m).length;
      s+=`<text x="${LX+6}" y="${py-6}">${m.toUpperCase()} ${n}</text>`;
    });
    s+=L(LX,cy-h*0.36,LX,cy+h*0.34,'em');
  }
  if(key==='orbit'){
    s+=`<ellipse class="em" cx="${cx}" cy="${cy}" rx="${Math.min(cw*0.34,420)*1.30}" ry="${Math.min(cw*0.34,420)*0.40}"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="3"/><text x="${cx-58}" y="${cy+4}">NO FIRST ITEM</text>`;
  }
  if(key==='wall'){
    const cols=META.side;
    const cwid=Math.min(cw/cols,(h*0.70)/cols), ch=cwid, rows=META.side;
    s+=`<rect x="${cx-cols*cwid/2}" y="${cy-rows*ch/2}" width="${cols*cwid}" height="${rows*ch}"/>`;
  }
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.innerHTML=s;
}

function info(d){
  const sw=c=>`<span class="chip" style="background:${c}"></span>`;
  document.getElementById('meta').innerHTML=
    `<span class="t">${d.title}</span>
     <div class="row"><i>rank</i><b>${d.rank} / ${RMAX}</b></div>
     <div class="row"><i>band</i><b>${META.bandLabels[d.spectrum]}${sw(BANDC[d.spectrum])}</b></div>
     <div class="row"><i>meaning</i><b>${d.meaning||'—'}${sw(MEANC[d.meaning]||'#555')}</b></div>
     <div class="row"><i>category</i><b>${d.category}</b></div>
     <div class="row"><i>colour</i><b>${d.hex}${sw(d.hex)}</b></div>
     <div class="row"><i>hue / light</i><b>${Math.round(d.h)}° · ${Math.round(d.l)}%</b></div>
     ${d.animated?`<div class="row"><i></i><b style="color:var(--hot)">ANIMATED — CLICK TO PLAY</b></div>`:''}
     ${d.aka.length?`<div class="aka">“${d.aka[0]}”</div>`:''}`;
}

function setLayout(k){
  cur=k;
  document.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',l.dataset.k===k));
  const L=LAYOUTS.find(l=>l.key===k), why=document.getElementById('why');
  why.style.opacity=0;
  setTimeout(()=>{
    why.querySelector('.hd').textContent=L.hd;
    why.querySelector('.bd').innerHTML=L.bd;
    why.querySelector('.ref').textContent=L.ref;
    why.style.opacity=1;
  },200);
  layout(k);
}

document.getElementById('lays').innerHTML=LAYOUTS.map((l,i)=>
  `<div class="lay" data-k="${l.key}"><span class="k">${i+1}</span>
   <span class="n">${l.name}</span><span class="r">${l.rule}</span></div>`).join('');
document.querySelectorAll('.lay').forEach(l=>l.onclick=()=>setLayout(l.dataset.k));

function setLegend(){
  const src = colourBy==='mean'
    ? META.meanings.map(m=>[m,MEANC[m],DATA.filter(d=>d.meaning===m).length])
    : colourBy==='band'
    ? META.bands.map(b=>[META.bandLabels[b],BANDC[b],DATA.filter(d=>d.spectrum===b).length])
    : [];
  document.getElementById('legend').innerHTML=src.map(([n,c,k])=>
    `<div class="lg"><div class="d" style="background:${c}"></div>${n.toUpperCase()} <b style="color:#f0efec">${k}</b></div>`).join('');
}

const pick=(id,mode)=>{
  document.getElementById(id).onclick=()=>{
    colourBy=mode;
    ['cb-band','cb-mean','cb-real'].forEach(x=>
      document.getElementById(x).classList.toggle('on',x===id));
    layout(cur); setLegend();
  };
};
pick('cb-band','band'); pick('cb-mean','mean'); pick('cb-real','real');

const tog=(id,fn)=>{const e=document.getElementById(id);
  e.onclick=()=>{e.classList.toggle('on');fn(e.classList.contains('on'))}};
tog('sw-str',v=>svg.classList.toggle('on',v));
tog('sw-spin',v=>{spin=v;if(!v){yaw=pitch=0;wt()}});
svg.classList.add('on');

function wt(){world.style.transform=`rotateX(${pitch}deg) rotateY(${yaw}deg)`}
addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-lx)*0.18;
  pitch=Math.max(-45,Math.min(45,pitch-(e.clientY-ly)*0.11));
  lx=e.clientX;ly=e.clientY;wt();
});
setInterval(()=>{if(spin&&!drag){yaw+=0.13;wt()}},32);
addEventListener('keydown',e=>{const i=parseInt(e.key,10)-1;if(LAYOUTS[i])setLayout(LAYOUTS[i].key)});
