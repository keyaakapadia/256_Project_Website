<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>256 — Islands</title>
<style>
  :root{
    --paper:#eae8e2; --ink:#131210; --soft:#8b8779; --rule:#cfcabb;
    --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab}
  body.drag{cursor:grabbing}

  #wire{position:fixed;inset:0;pointer-events:none}
  #world{position:fixed;inset:0}

  .node{position:absolute;will-change:transform;cursor:pointer}
  .node img{display:block;width:100%;height:100%;object-fit:cover;background:#d9d5ca;
    border:2px solid;box-sizing:border-box}
  .node .ring{position:absolute;inset:-5px;border:1.5px solid;opacity:0;transition:opacity .14s}
  .node .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;
    opacity:0;transition:opacity .14s;text-align:center;pointer-events:none;white-space:nowrap}
  .node .tag b{display:block;font-weight:500;font-size:12px;letter-spacing:-.01em;
    max-width:250px;white-space:normal;line-height:1.3}
  .node.on .ring,.node.on .tag{opacity:1}

  .isle{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
        font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;white-space:nowrap}
  .isle em{font-style:normal;opacity:.55;margin-left:6px;letter-spacing:.06em}

  /* ---------- chrome ---------- */
  .panel{position:fixed;z-index:30;background:rgba(234,232,226,.94);padding:9px 12px}
  .brand{left:20px;top:16px;font-size:30px;line-height:1;letter-spacing:-.035em;font-weight:600;
         padding:4px 10px 6px}
  #tieby{left:20px;top:66px;width:186px}
  #tieby h4{margin:0 0 8px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;
            color:var(--soft);font-weight:500}
  .tb{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--soft);
      user-select:none;font-size:11px}
  .tb i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;opacity:.45}
  .tb b{font-weight:400;flex:1}
  .tb span{font-size:10px;font-variant-numeric:tabular-nums;opacity:.7}
  .tb:hover{color:var(--ink)}
  .tb.on{color:var(--ink)} .tb.on i{opacity:1} .tb.on b{font-weight:500}
  #blurb{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
         font-size:10px;line-height:1.6;color:var(--soft)}
  #blurb b{color:var(--ink);font-weight:500}

  .legend{left:18px;bottom:16px;display:flex;gap:13px;flex-wrap:wrap;max-width:60vw}
  .lg{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--soft);
      cursor:pointer;user-select:none}
  .lg i{width:8px;height:8px;border-radius:50%;display:block}
  .lg.mute{opacity:.3} .lg:hover{color:var(--ink)}

  .hint{right:18px;top:16px;text-align:right;font-size:10px;color:var(--soft);line-height:1.7}
  .note{right:18px;bottom:16px;text-align:right;font-size:10px;color:var(--soft);line-height:1.75}
  .note b{color:var(--ink);font-weight:500}

  #card{right:18px;top:72px;width:214px;display:none}
  #card .t{font-size:13px;font-weight:500;line-height:1.32;letter-spacing:-.012em;margin-bottom:9px}
  #card .r{display:flex;justify-content:space-between;gap:10px;font-size:10px;
           padding:3px 0;border-top:1px solid var(--rule);color:var(--soft)}
  #card .r b{color:var(--ink);font-weight:400;text-align:right}
  #card .x{position:absolute;right:8px;top:6px;color:var(--soft);cursor:pointer;font-size:14px;
           line-height:1}
  #card .x:hover{color:var(--ink)}

  #boot{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;
        align-items:center;justify-content:center;flex-direction:column;gap:10px;
        transition:opacity .6s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .n{font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  #boot .s{font-size:11px;color:var(--soft);letter-spacing:.1em}
</style>
</head>
<body>

<canvas id="wire"></canvas>
<div id="world"></div>

<div class="panel brand">256</div>
<div class="panel" id="tieby"><h4>Tie by</h4><div id="tblist"></div><div id="blurb"></div></div>
<div class="panel hint">drag to move · scroll to zoom<br>hover a picture · click to keep it</div>
<div class="panel legend" id="legend"></div>
<div class="panel note" id="note"></div>
<div class="panel" id="card"></div>

<div id="boot"><div class="n" id="bootn">0</div><div class="s">OF 144 PICTURES</div></div>

<script src="../assets/data8.js?b=6"></script>
<script>
/* ------------------------------------------------------------------
   Islands are themes, spread across a plane. The camera never turns:
   you pan and dolly, so nothing hides behind anything.

   Every tie is drawn as a gradient between the theme colours of its
   two ends. A line that changes colour crossed a boundary. Switching
   "Tie by" changes what a tie means — and the share of two-coloured
   lines is the whole argument, made countable.
------------------------------------------------------------------ */

const world = document.getElementById('world');
const cv = document.getElementById('wire'), ctx = cv.getContext('2d');
const TILE = META.tile, B = META.bounds;

let camX = (B[0] + B[2]) / 2, camY = (B[1] + B[3]) / 2;
let dist = 9200, focal = 1400;
let drag = false, lx = 0, ly = 0, moved = false;
let tie = 'measure', hot = -1, pinned = -1, muted = new Set();

const E = () => META.ties[tie].edges;

/* ---------- pictures ---------- */
const nodes = DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML =
    `<img src="${THUMB(d.thumb)}" alt="" style="border-color:${d.tc}">
     <div class="ring" style="border-color:${d.tc}"></div>
     <div class="tag"><b>${d.title}</b></div>`;
  el.addEventListener('mouseenter', () => { hot = i; paint(); });
  el.addEventListener('mouseleave', () => { hot = -1; paint(); });
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (moved) return;
    pinned = pinned === i ? -1 : i;
    showCard(); paint();
  });
  world.appendChild(el);
  return el;
});
addEventListener('click', () => { if (!moved && pinned >= 0) { pinned = -1; showCard(); paint(); } });

const isles = META.themes.map(t => {
  const el = document.createElement('div');
  el.className = 'isle';
  el.style.color = META.color[t];
  el.innerHTML = `${t}<em>${META.themeCounts[t] || 0}</em>`;
  world.appendChild(el);
  return { t, el, p: META.centroids[t] };
});

/* ---------- projection ---------- */
function project(x, y, z){
  const d = z + dist;
  if (d < 90) return null;
  const s = focal / d;
  return { x: innerWidth / 2 + (x - camX) * s, y: innerHeight / 2 + (y - camY) * s, s, d };
}
const refScale = () => focal / dist;

function rgba(hex, a){
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
}
function tieStroke(pa, pb, ca, cb, a){
  if (ca === cb) return rgba(ca, a);
  const g = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
  g.addColorStop(0, rgba(ca, a)); g.addColorStop(1, rgba(cb, a));
  return g;
}
function kinOf(i){
  const s = new Set();
  E().forEach(([a, b]) => { if (a === i) s.add(b); if (b === i) s.add(a); });
  return s;
}

/* ---------- draw ---------- */
function paint(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const focusI = pinned >= 0 ? pinned : hot;
  const P = DATA.map(d => project(d.x, d.y, d.z));
  const kin = focusI >= 0 ? kinOf(focusI) : null;
  const live = i => !muted.has(DATA[i].theme);

  E().forEach(([a, b]) => {
    const pa = P[a], pb = P[b];
    if (!pa || !pb || !live(a) || !live(b)) return;
    const on = focusI >= 0 && (a === focusI || b === focusI);
    const ca = DATA[a].tc, cb = DATA[b].tc;
    if (focusI >= 0 && !on) { ctx.strokeStyle = tieStroke(pa, pb, ca, cb, .05); ctx.lineWidth = 1; }
    else if (on)            { ctx.strokeStyle = tieStroke(pa, pb, ca, cb, 1);   ctx.lineWidth = 2; }
    else                    { ctx.strokeStyle = tieStroke(pa, pb, ca, cb, .34); ctx.lineWidth = 1; }
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });

  DATA.map((_, i) => i).filter(i => P[i]).sort((a, b) => P[b].d - P[a].d).forEach(i => {
    const p = P[i], el = nodes[i];
    const w = TILE * p.s;
    const far = Math.max(.42, Math.min(1, 1.5 - p.d / (dist * 2.4)));
    el.style.transform = `translate(${p.x - w / 2}px,${p.y - w / 2}px)`;
    el.style.width = w + 'px'; el.style.height = w + 'px';
    el.style.opacity = !live(i) ? .05
      : focusI < 0 ? far : (i === focusI ? 1 : kin.has(i) ? .95 : .11);
    el.style.zIndex = 10000 - Math.round(p.d);
    el.classList.toggle('on', i === focusI);
  });

  isles.forEach(o => {
    const p = project(o.p[0], o.p[1] - 470, 0);
    if (!p) { o.el.style.opacity = 0; return; }
    o.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
    o.el.style.opacity = muted.has(o.t) ? .28 : .9;
    o.el.style.fontSize = Math.max(9, Math.min(16, 11 * p.s * 1.15)) + 'px';
  });
}

/* ---------- the card, only when something is kept ---------- */
function showCard(){
  const c = document.getElementById('card');
  if (pinned < 0) { c.style.display = 'none'; return; }
  const d = DATA[pinned], kin = kinOf(pinned);
  const out = [...new Set([...kin].map(j => DATA[j].theme))].filter(t => t !== d.theme);
  c.style.display = 'block';
  c.innerHTML =
    `<div class="x">×</div>
     <div class="t">${d.title}</div>
     <div class="r"><span>theme</span><b style="color:${d.tc}">${d.theme}</b></div>
     <div class="r"><span>subject</span><b>${d.cat}</b></div>
     <div class="r"><span>divisions</span><b>${d.v} × ${d.h} — ${d.cells}</b></div>
     <div class="r"><span>ties</span><b>${kin.size}</b></div>
     <div class="r"><span>reaches</span><b>${out.length ? out.join(', ') : 'only its own theme'}</b></div>`;
  c.querySelector('.x').onclick = e => { e.stopPropagation(); pinned = -1; showCard(); paint(); };
}

/* ---------- controls ---------- */
document.getElementById('tblist').innerHTML = META.tieOrder.map(key => {
  const t = META.ties[key];
  return `<div class="tb${key === tie ? ' on' : ''}" data-k="${key}">
            <i></i><b>${t.label}</b><span>${t.cross}%</span></div>`;
}).join('');
function setBlurb(){
  const t = META.ties[tie];
  document.getElementById('blurb').innerHTML =
    `Tied when two pictures share ${t.blurb}.<br>
     <b>${t.cross}%</b> of those ties leave their own island — the two-coloured lines.`;
}
document.querySelectorAll('.tb').forEach(el => el.onclick = () => {
  tie = el.dataset.k;
  document.querySelectorAll('.tb').forEach(o => o.classList.toggle('on', o === el));
  setBlurb(); showCard(); paint();
});

document.getElementById('legend').innerHTML = META.themes.map(t =>
  `<div class="lg" data-t="${t}"><i style="background:${META.color[t]}"></i>${t}</div>`).join('');
document.querySelectorAll('.lg').forEach(el => el.onclick = () => {
  const t = el.dataset.t;
  muted.has(t) ? muted.delete(t) : muted.add(t);
  el.classList.toggle('mute', muted.has(t));
  paint();
});

document.getElementById('note').innerHTML =
  `<b>${META.total}</b> pictures · <b>${META.themes.length}</b> themes<br>colour is the theme, on the pictures and the ties`;

/* ---------- navigation ---------- */
addEventListener('mousedown', e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('drag'); });
addEventListener('mouseup', () => { drag = false; document.body.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) moved = true;
  const s = refScale();
  camX -= (e.clientX - lx) / s; camY -= (e.clientY - ly) / s;
  lx = e.clientX; ly = e.clientY; paint();
});
addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(380, Math.min(13000, dist * (e.deltaY > 0 ? 1.075 : .93)));
  paint();
}, { passive: false });
addEventListener('resize', paint);

/* ---------- wait for the pictures, then reveal ---------- */
let loaded = 0;
const bootn = document.getElementById('bootn');
world.querySelectorAll('img').forEach(img => {
  const tick = () => {
    bootn.textContent = ++loaded;
    if (loaded >= DATA.length) {
      paint();
      setTimeout(() => document.getElementById('boot').classList.add('gone'), 220);
    }
  };
  img.complete ? tick() : (img.onload = tick, img.onerror = tick);
});

setBlurb(); paint();
</script>
</body>
</html>
